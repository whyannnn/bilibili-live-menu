const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// 上传图片压缩：原图动辄 2-5MB，base64 后更肿。这里按最长边限制 + 有损压缩，
// 典型 4MB 照片压到 100-300KB，localStorage 和渲染都不再被拖死。
// 返回 Promise<dataURL>
function compressImageFile(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const src = ev.target.result;
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { resolve(src); return; }
        const scale = Math.min(1, maxDim / Math.max(w, h));
        // 小图且已经是轻量格式，直接原样返回
        if (scale === 1 && src.length < 400 * 1024) { resolve(src); return; }
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // PNG 保留透明（模板图需要），其余转 JPEG 大幅减小体积
        const hasAlpha = file.type === 'image/png' || file.type === 'image/webp';
        let out;
        try {
          out = hasAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', quality);
        } catch (e) {
          out = src;
        }
        // 压完反而更大就退回原图
        resolve(out && out.length < src.length ? out : src);
      };
      img.onerror = () => resolve(src);
      img.src = src;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

function fileSizeText(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + 'KB';
  return (n / 1024 / 1024).toFixed(1) + 'MB';
}

/* ============== Persistence ============== */
const STORAGE_KEY = 'bili-menu-v2';
const LIB_KEY = 'bili-menu-lib-v1';

function saveState() {
  // 防抖：render() 会频繁调 saveState（拖拽、改样式、选中…），
  // 每次都全量 JSON.stringify + localStorage.setItem（同步阻塞主线程）+ history.replaceState，
  // 数据一大（尤其带 base64 图片）就会明显卡顿。这里合并成 200ms 一次。
  if (_persistTimer) clearTimeout(_persistTimer);
  _persistTimer = setTimeout(persistNow, 200);
}

function persistNow() {
  if (_persistTimer) { clearTimeout(_persistTimer); _persistTimer = null; }
  try {
    const data = {
      m: state.mode,
      i: state.menu.items.map(it => ({
        id: it.id, n: it.name, c: it.count, u: it.iconUrl,
        t: it.iconType, s: it.side, x: it.x, y: it.y,
        st: it.style || null
      })),
      ti: state.textItems.map(t => ({
        id: t.id, txt: t.text, x: t.x, y: t.y, w: t.w,
        sz: t.fontSize, c: t.color, sw: t.strokeWidth, sc: t.strokeColor,
        ff: t.fontFamily, fw: t.fontWeight,
        ls: t.letterSpacing || 0,
        z: t.z || 0
      })),
      ii: state.imageItems.map(im => ({
        id: im.id, u: im.url, n: im.name,
        x: im.x, y: im.y, w: im.w, h: im.h, z: im.z || 0,
        lk: im.locked ? 1 : 0
      })),
      is: state.imageSelection,
      s: {
        lX: state.style.leftX, rX: state.style.rightX, tY: state.style.topY,
        cW: state.style.colWidth, rH: state.style.rowHeight, rG: state.style.rowGap,
        sN: state.style.showNumbers, sB: state.style.showBackground,
        bC: state.style.bgColor, bO: state.style.bgOpacity, bR: state.style.bgRadius,
        fF: state.style.fontFamily, fS: state.style.fontStyle, fW: state.style.fontWeight,
        fZ: state.style.fontSize, lS: state.style.letterSpacing,
        tC: state.style.textColor, sC: state.style.strokeColor, sW: state.style.strokeWidth,
        shX: state.style.shadowX, shY: state.style.shadowY, shB: state.style.shadowBlur, shC: state.style.shadowColor,
        iS: state.style.iconSize, iG: state.style.iconGap
      },
      mx: state.menu.x, my: state.menu.y,
      z: state.zoom, px: state.panX, py: state.panY
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    saveImageLibrary();
    updateHash();
  } catch (e) { /* ignore quota */ }
}

let _persistTimer = null;
// 关页面/切后台时把待写入的数据落地，避免防抖丢数据
window.addEventListener('beforeunload', persistNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) persistNow(); });

// 上传图片库存独立键：体积大（base64），和主数据分开存，
// 这样 hash / ?d= 加载路径也能单独还原它（#i<n> 引用需要它），且不用重复解析主 JSON。
function saveImageLibrary() {
  try {
    const lib = state.imageLibrary.filter(e => e.isUpload).map(e => ({ n: e.name, u: e.url }));
    localStorage.setItem(LIB_KEY, JSON.stringify(lib));
  } catch (e) { /* quota */ }
}

function loadImageLibraryFromStorage() {
  try {
    let arr = null;
    const raw = localStorage.getItem(LIB_KEY);
    if (raw) arr = JSON.parse(raw);
    if (!arr) {
      // 老版本兼容：库混在主数据的 il 字段里，做一次迁移
      const main = localStorage.getItem(STORAGE_KEY);
      if (main) {
        const d = JSON.parse(main);
        if (d && Array.isArray(d.il)) arr = d.il;
      }
    }
    if (!Array.isArray(arr)) return;
    arr.forEach(e => {
      if (e && e.u && !state.imageLibrary.some(x => x.url === e.u)) {
        state.imageLibrary.push({ name: e.n || '图片', url: e.u, isUpload: true });
      }
    });
  } catch (e) { /* ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.m) state.mode = d.m;
    if (d.i && d.i.length) state.menu.items = d.i.map(it => ({
      id: it.id || uid(), name: it.n || '', count: it.c || 0,
      iconUrl: it.u || '', iconType: it.t || 'lib',
      side: it.s || 'left', x: it.x, y: it.y, style: it.st || null
    }));
    if (d.ti) state.textItems = d.ti.map(t => ({
      id: t.id || uid(), text: t.txt || '', x: t.x || 0, y: t.y || 0,
      w: t.w || null, fontSize: t.sz || 32, color: t.c || '#ffffff',
      strokeWidth: t.sw || 2, strokeColor: t.sc || '#000000',
      fontFamily: t.ff || '',
      fontWeight: String(t.fw) === '400' ? '400' : '900',
      letterSpacing: t.ls != null ? t.ls : 0,
      z: t.z || 0
    }));
    if (d.ts != null) {
      // 兼容老数据：可能是单个 id 字符串
      state.textSelection = Array.isArray(d.ts) ? d.ts : (d.ts ? [d.ts] : []);
    }
    if (d.ii) state.imageItems = d.ii.map(im => ({
      id: im.id || uid(), url: im.u || '', name: im.n || '图片',
      x: im.x || 0, y: im.y || 0, w: im.w || 200, h: im.h || 100, z: im.z || 0,
      locked: !!im.lk
    }));
    if (d.is) state.imageSelection = d.is;
    // 上传图片库：独立键存（老数据回落到 il 字段）
    loadImageLibraryFromStorage();
    if (d.s) {
      const s = state.style;
      if (d.s.lX != null) s.leftX = d.s.lX;
      if (d.s.rX !== undefined) s.rightX = d.s.rX;
      if (d.s.tY != null) s.topY = d.s.tY;
      if (d.s.cW != null) s.colWidth = d.s.cW;
      if (d.s.rH != null) s.rowHeight = d.s.rH;
      if (d.s.rG != null) s.rowGap = d.s.rG;
      if (d.s.sN != null) s.showNumbers = d.s.sN;
      if (d.s.sB != null) s.showBackground = d.s.sB;
      if (d.s.bC) s.bgColor = d.s.bC;
      if (d.s.bO != null) s.bgOpacity = d.s.bO;
      if (d.s.bR != null) s.bgRadius = d.s.bR;
      if (d.s.fF) s.fontFamily = d.s.fF;
      if (d.s.fS) s.fontStyle = d.s.fS;
      if (d.s.fW) s.fontWeight = String(d.s.fW) === '400' ? '400' : '900';
      if (d.s.fZ != null) s.fontSize = d.s.fZ;
      if (d.s.lS != null) s.letterSpacing = d.s.lS;
      if (d.s.tC) s.textColor = d.s.tC;
      if (d.s.sC) s.strokeColor = d.s.sC;
      if (d.s.sW != null) s.strokeWidth = d.s.sW;
      if (d.s.shX != null) s.shadowX = d.s.shX;
      if (d.s.shY != null) s.shadowY = d.s.shY;
      if (d.s.shB != null) s.shadowBlur = d.s.shB;
      if (d.s.shC) s.shadowColor = d.s.shC;
      if (d.s.iS != null) s.iconSize = d.s.iS;
      if (d.s.iG != null) s.iconGap = d.s.iG;
    }
    if (d.mx != null) state.menu.x = d.mx;
    if (d.my != null) state.menu.y = d.my;
    if (d.z != null && d.z >= 0.1 && d.z <= 10) state.zoom = d.z;
    if (d.px != null) state.panX = d.px;
    if (d.py != null) state.panY = d.py;
    return true;
  } catch (e) { return false; }
}

// ---- base64url 编解码（UTF-8 安全，URL 安全，不含 +/= 避免百分号膨胀）----
function encodeState(data) {
  const json = JSON.stringify(data);
  let b64;
  try { b64 = btoa(unescape(encodeURIComponent(json))); }
  catch (e) { b64 = btoa(encodeURIComponent(json)); }
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeState(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  let json;
  try { json = decodeURIComponent(escape(atob(b64))); }
  catch (e) { json = decodeURIComponent(atob(b64)); } // 旧格式兼容
  return JSON.parse(json);
}

// style 默认值，用于序列化时 diff（省略相同字段以缩短 URL）
const DEFAULT_STYLE = {
  leftX: 40, rightX: null, topY: 40, colWidth: 166, rowHeight: 40,
  rowGap: 5, showNumbers: true, showBackground: true,
  bgColor: '#000000', bgOpacity: 0.3, bgRadius: 24,
  fontFamily: 'system-ui', customFontLoaded: false,
  fontStyle: 'normal', fontWeight: '900', fontSize: 20,
  letterSpacing: 2, textColor: '#ffffff', strokeColor: '#000000',
  strokeWidth: 1, shadowX: 1, shadowY: -1, shadowBlur: 5,
  shadowColor: '#000000', iconSize: 37, iconGap: 0
};

// per-item style 紧凑 key 映射（缩短 URL）
const STYLE_KEY_SHORT = {
  fontFamily: 'ff', fontStyle: 'fy', fontWeight: 'fw', fontSize: 'fs',
  letterSpacing: 'ls', lineHeight: 'lh',
  textColor: 'tc', strokeColor: 'sc', strokeWidth: 'sw',
  shadowX: 'sx', shadowY: 'sy', shadowBlur: 'sb', shadowColor: 'sh',
  bgOn: 'bO', bgColor: 'bc', bgOpacity: 'bp', bgRadius: 'br',
  colWidth: 'cw', rowHeight: 'rh', rowGap: 'rg', side: 'sd'
};
const STYLE_KEY_FULL = {};
for (const k in STYLE_KEY_SHORT) STYLE_KEY_FULL[STYLE_KEY_SHORT[k]] = k;

function packItemStyle(s) {
  if (!s) return null;
  const out = {};
  for (const k in s) out[STYLE_KEY_SHORT[k] || k] = s[k];
  return out;
}
function unpackItemStyle(s) {
  if (!s) return null;
  const out = {};
  for (const k in s) out[STYLE_KEY_FULL[k] || k] = s[k];
  return out;
}

function updateHash() {
  try {
    // 紧凑数组格式：[mode[0], items, menuX, menuY, styleDiff?, textItems?]
    // items: [[name, count, side[0], iconUrl?, iconType?, x?, y?, style?], ...]
    // 解析时用 typeof 判断 iconUrl(string)/iconType(string)/x(number)/y(number)/style(object)
    const data = [
      state.mode[0], // 'v' or 'h'
      state.menu.items.map(it => {
        const a = [it.name, it.count, (it.side || 'left')[0]];
        if (it.iconUrl) a.push(urlToToken(it.iconUrl));
        if (it.iconType && it.iconType !== 'lib') a.push(it.iconType);
        if (it.x != null) a.push(Math.round(it.x));
        if (it.y != null) a.push(Math.round(it.y));
        const ps = packItemStyle(it.style);
        if (ps) a.push(ps);
        return a;
      }),
      Math.round(state.menu.x),
      Math.round(state.menu.y)
    ];
    // style diff（只输出与默认值不同的字段）
    const styleDiff = {};
    for (const k in state.style) {
      if (JSON.stringify(state.style[k]) !== JSON.stringify(DEFAULT_STYLE[k])) {
        styleDiff[k] = state.style[k];
      }
    }
    if (Object.keys(styleDiff).length) data.push(styleDiff);
    // textItems
    if (state.textItems.length) {
      data.push(state.textItems.map(t => {
        const a = [t.text, Math.round(t.x), Math.round(t.y)];
        const o = {};
        if (t.w) o.w = t.w;
        if (t.fontSize !== 32) o.sz = t.fontSize;
        if (t.color !== '#ffffff') o.c = t.color;
        if (t.strokeWidth !== 2) o.sw = t.strokeWidth;
        if (t.strokeColor !== '#000000') o.sc = t.strokeColor;
        if (t.fontFamily) o.ff = t.fontFamily;
        if (t.fontWeight !== '900') o.fw = t.fontWeight;
        if (t.letterSpacing) o.ls = t.letterSpacing;
        if (Object.keys(o).length) a.push(o);
        return a;
      }));
    }
    // imageItems: [[url, x, y, w, h, z?, 'L'?], ...] — 末尾 'L' 标记锁定 — 不存 name，库内模板按 url 重新匹配名字
    if (state.imageItems.length) {
      data.push(state.imageItems.map(im => {
        const a = [urlToToken(im.url), Math.round(im.x), Math.round(im.y), Math.round(im.w), Math.round(im.h)];
        if (im.z != null && im.z !== 0) a.push(im.z);
        if (im.locked) {
          // 确保 z 占位存在，再追加锁定标记
          if (typeof a[5] !== 'number') a.push(0);
          a.push('L');
        }
        return a;
      }));
    }
    const hash = encodeState(data);
    state.lastCopiedHash = hash;
    // 性能：URL hash 太长时浏览器处理 history.replaceState 会非常慢（几千项数据能到几百 KB），
    // 这里直接跳过写 hash——数据仍在 localStorage 里，只有"分享链接"能力受影响。
    if (hash.length > 60000) {
      if (!state._hashSkipped) {
        state._hashSkipped = true;
        const st = $('#icon-update-status');
        if (st) st.textContent = '数据较大：已存本地，分享链接已省略';
      }
      return;
    }
    state._hashSkipped = false;
    const newUrl = location.pathname + location.search + '#' + hash;
    if (location.hash !== '#' + hash) {
      history.replaceState(null, '', newUrl);
    }
  } catch (e) { /* hash too long */ }
}

function loadFromHash() {
  try {
    const hash = location.hash.slice(1);
    if (!hash) return false;
    const d = decodeState(hash);
    return applyLoadedData(d);
  } catch (e) { return false; }
}

// 把已解码的数据套到 state 上。支持新数组格式和旧对象格式。返回 true 表示成功。
function applyLoadedData(d) {
  try {
    if (Array.isArray(d)) {
      // 新格式：紧凑数组 [mode, items, menuX, menuY, styleDiff?, textItems?]
      state.mode = d[0] === 'h' ? 'horizontal' : 'vertical';
      if (d[1] && d[1].length) {
        state.menu.items = d[1].map(a => {
          let idx = 3, iconUrl = '', iconType = 'lib', x = null, y = null, style = null;
          if (a.length > idx && typeof a[idx] === 'string' && a[idx]) { iconUrl = tokenToUrl(a[idx]); idx++; }
          if (a.length > idx && typeof a[idx] === 'string') { iconType = a[idx]; idx++; }
          if (a.length > idx && typeof a[idx] === 'number') { x = a[idx]; idx++; }
          if (a.length > idx && typeof a[idx] === 'number') { y = a[idx]; idx++; }
          if (a.length > idx && typeof a[idx] === 'object' && a[idx]) { style = unpackItemStyle(a[idx]); idx++; }
          return {
            id: uid(), name: a[0] || '', count: a[1] || 0,
            side: a[2] === 'r' ? 'right' : 'left',
            iconUrl, iconType, x, y, style
          };
        });
      }
      if (typeof d[2] === 'number') state.menu.x = d[2];
      if (typeof d[3] === 'number') state.menu.y = d[3];
      if (d[4] && typeof d[4] === 'object' && !Array.isArray(d[4])) Object.assign(state.style, d[4]);
      if (d[5] && Array.isArray(d[5])) {
        state.textItems = d[5].map(a => {
          const o = a[3] && typeof a[3] === 'object' ? a[3] : {};
          return {
            id: uid(), text: a[0] || '', x: a[1] || 0, y: a[2] || 0,
            w: null, fontSize: 32, color: '#ffffff',
            strokeWidth: 2, strokeColor: '#000000',
            fontFamily: '', fontWeight: '900',
            letterSpacing: o.ls != null ? o.ls : 0,
            z: 0,
            ...o
          };
        });
      }
      // imageItems: 第 6 段（textItems 之后） — [url, x, y, w, h, z?, 'L'?]
      if (d[6] && Array.isArray(d[6])) {
        state.imageItems = d[6].map(a => {
          const url = tokenToUrl(a[0] || '');
          const libEntry = state.imageLibrary.find(e => e.url === url);
          const locked = a[a.length - 1] === 'L';
          return {
            id: uid(),
            url, name: libEntry ? libEntry.name : '图片',
            x: a[1] || 0, y: a[2] || 0,
            w: a[3] || 200, h: a[4] || 100,
            z: typeof a[5] === 'number' ? a[5] : 0,
            locked
          };
        });
      }
    } else {
      // 旧格式：对象（向后兼容）
      if (d.m) state.mode = d.m;
      if (d.i && d.i.length) state.menu.items = d.i.map(it => ({
        id: it.id || uid(), name: it.n || '', count: it.c || 0,
        iconUrl: tokenToUrl(it.u || ''), iconType: it.t || 'lib',
        side: it.s || 'left', x: it.x, y: it.y, style: it.st || null
      }));
      if (d.ti) state.textItems = d.ti.map(t => ({
        id: t.id || uid(), text: t.txt || '', x: t.x || 0, y: t.y || 0,
        w: t.w || null, fontSize: t.sz || 32, color: t.c || '#ffffff',
        strokeWidth: t.sw || 2, strokeColor: t.sc || '#000000',
        fontFamily: t.ff || '', fontWeight: String(t.fw) === '400' ? '400' : '900',
        letterSpacing: t.ls != null ? t.ls : 0
      }));
      if (d.s) Object.assign(state.style, d.s);
      if (d.mx != null) state.menu.x = d.mx;
      if (d.my != null) state.menu.y = d.my;
    }
    return true;
  } catch (e) { return false; }
}

/* ============== Canvas / Mode ============== */
function applyMode() {
  state.canvas = state.mode === 'vertical'
    ? { width: 1080, height: 1920 }
    : { width: 1920, height: 1080 };
  document.body.classList.toggle('mode-vertical', state.mode === 'vertical');
  document.body.classList.toggle('mode-horizontal', state.mode !== 'vertical');
  const stage = $('#stage');
  stage.style.width = state.canvas.width + 'px';
  stage.style.height = state.canvas.height + 'px';

  $('#safe-area').style.display = (state.showSafe && state.mode === 'vertical') ? 'block' : 'none';
  if (state.mode === 'vertical') {
    Object.assign($('#safe-area').style, {
      left: SAFE_AREA.left + 'px', top: SAFE_AREA.top + 'px',
      width: SAFE_AREA.width + 'px', height: SAFE_AREA.height + 'px'
    });
  }
  $('#status-canvas').textContent = `${state.canvas.width}×${state.canvas.height}`;
  applyTransform();
  render();
}

function applyTransform() {
  const scaler = $('#stage-scaler');
  const wrap = $('#canvas-wrap');
  const isSource = document.body.classList.contains('source-mode');

  if (isSource) {
    // 浏览器源模式：fit 缩放铺满窗口（保持画布比例），居中
    // 用绝对像素偏移居中：translate(-50%,-50%) 的百分比基于原始尺寸，
    // 当 scale≠1 时会让舞台偏出视口（横板 1920×1080 尤其明显，画面直接消失）。
    const w = wrap.clientWidth || window.innerWidth;
    const h = wrap.clientHeight || window.innerHeight;
    const s = Math.min(w / state.canvas.width, h / state.canvas.height);
    const offsetX = (w - state.canvas.width * s) / 2;
    const offsetY = (h - state.canvas.height * s) / 2;
    scaler.style.left = offsetX + 'px';
    scaler.style.top = offsetY + 'px';
    scaler.style.width = state.canvas.width + 'px';
    scaler.style.height = state.canvas.height + 'px';
    scaler.style.transform = `scale(${s})`;
    scaler.style.transformOrigin = '0 0';
  } else {
    // 编辑器模式：用户缩放 + 平移（用 wrap 滚动条作为平移机制）
    const s = state.zoom;
    const vp = $('#canvas-viewport');
    const w = state.canvas.width * s;
    const h = state.canvas.height * s;
    vp.style.width = w + 'px';
    vp.style.height = h + 'px';
    scaler.style.width = state.canvas.width + 'px';
    scaler.style.height = state.canvas.height + 'px';
    scaler.style.transform = `scale(${s})`;
    scaler.style.transformOrigin = '0 0';
    // 把 panX/panY 应用到 wrap 滚动（保持缩放/平移同步）
    // 滚动后会把新值同步回 state.panX/panY（scroll 监听器）
    const centerScrollX = (wrap.scrollWidth - wrap.clientWidth) / 2;
    const centerScrollY = (wrap.scrollHeight - wrap.clientHeight) / 2;
    if (Math.abs(wrap.scrollLeft - (centerScrollX + state.panX)) > 1 ||
        Math.abs(wrap.scrollTop - (centerScrollY + state.panY)) > 1) {
      wrap.scrollLeft = centerScrollX + state.panX;
      wrap.scrollTop = centerScrollY + state.panY;
    }
  }
  updateZoomLabel();
}

function fitToWindow() {
  const wrap = $('#canvas-wrap');
  const w = wrap.clientWidth - 48;
  const h = wrap.clientHeight - 48;
  state.zoom = Math.min(w / state.canvas.width, h / state.canvas.height, 1);
  state.zoom = Math.max(0.05, state.zoom);
  state.panX = 0;
  state.panY = 0;
  applyTransform();
  // 等浏览器布局完成，让 wrap 滚动到中心
  requestAnimationFrame(() => {
    wrap.scrollLeft = (wrap.scrollWidth - wrap.clientWidth) / 2;
    wrap.scrollTop = (wrap.scrollHeight - wrap.clientHeight) / 2;
    saveState();
  });
}

function updateZoomLabel() {
  $('#zoom-label').textContent = Math.round(state.zoom * 100) + '%';
}

/* ============== Render ============== */
function render() {
  renderMenuItems();
  renderTextItems();
  renderImageItems();
  renderItemsList();
  updateSelectionUI();
  $('#status-pos').textContent = `${Math.round(state.menu.x)}, ${Math.round(state.menu.y)}`;
  $('#status-count').textContent = state.menu.items.length;
  saveState();
}

// 描边用 text-shadow 叠加实现。描边宽 w 会生成约 πw² 个 shadow（w=5 就 80+ 个），
// 每次 render 都重算会明显拖慢。这里按 "宽+色" 缓存结果。
const _strokeCache = new Map();
function buildStrokeShadows(width, color) {
  const w = Math.max(0, width);
  if (w === 0) return 'none';
  const key = w + '|' + (color || '#000000');
  const hit = _strokeCache.get(key);
  if (hit) return hit;
  const shadows = [];
  for (let dy = -w; dy <= w; dy++) {
    for (let dx = -w; dx <= w; dx++) {
      if (dx * dx + dy * dy <= w * w) {
        shadows.push(`${dx}px ${dy}px 0 ${color}`);
      }
    }
  }
  const out = shadows.join(', ');
  if (_strokeCache.size > 200) _strokeCache.clear(); // 简单防膨胀
  _strokeCache.set(key, out);
  return out;
}

function hexToRgba(hex, alpha) {
  const a = Math.max(0, Math.min(1, Number(alpha) || 0));
  let h = String(hex || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6) h = '000000';
  const r = parseInt(h.slice(0, 2), 16) || 0;
  const g = parseInt(h.slice(2, 4), 16) || 0;
  const b = parseInt(h.slice(4, 6), 16) || 0;
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function getEffectiveStyle(item) {
  const s = state.style;
  const st = item.style || {};
  return {
    fontFamily: st.fontFamily || s.fontFamily,
    fontStyle: st.fontStyle || s.fontStyle,
    fontWeight: st.fontWeight || s.fontWeight,
    fontSize: st.fontSize != null ? st.fontSize : s.fontSize,
    letterSpacing: st.letterSpacing != null ? st.letterSpacing : s.letterSpacing,
    lineHeight: st.lineHeight != null ? st.lineHeight : (s.lineHeight != null ? s.lineHeight : 1.4),
    textColor: st.textColor || s.textColor,
    strokeColor: st.strokeColor || s.strokeColor,
    strokeWidth: st.strokeWidth != null ? st.strokeWidth : s.strokeWidth,
    shadowX: st.shadowX != null ? st.shadowX : s.shadowX,
    shadowY: st.shadowY != null ? st.shadowY : s.shadowY,
    shadowBlur: st.shadowBlur != null ? st.shadowBlur : s.shadowBlur,
    shadowColor: st.shadowColor || s.shadowColor,
    bgOn: st.bgOn != null ? st.bgOn : s.showBackground,
    bgColor: st.bgColor || s.bgColor,
    bgOpacity: st.bgOpacity != null ? st.bgOpacity : s.bgOpacity,
    bgRadius: st.bgRadius != null ? st.bgRadius : s.bgRadius,
    colWidth: st.colWidth != null ? st.colWidth : s.colWidth,
    rowHeight: st.rowHeight != null ? st.rowHeight : s.rowHeight,
    rowGap: s.rowGap,  // 强制全局（gap 是 item 间关系，不是 per-item 属性）
    side: st.side || item.side || 'left'
  };
}

function getItemPos(item) {
  const idx = state.menu.items.indexOf(item);
  let x = item.x, y = item.y;
  if (x == null || y == null) {
    const p = autoPosition(item, idx);
    x = p.x; y = p.y;
  }
  return { x, y };
}

function renderMenuItems() {
  const container = $('#menu-items');
  container.innerHTML = '';
  const s = state.style;
  state.menu.items.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'menu-item';
    el.dataset.id = item.id;
    if (state.selection.includes(item.id)) el.classList.add('selected');

    const st = getEffectiveStyle(item);
    let x = item.x, y = item.y;
    if (x == null || y == null) {
      const pos = autoPosition(item, idx);
      x = pos.x; y = pos.y;
    }
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    // 列宽自适应：宽度不设，让 flex 容器按内容自然撑开
    el.style.height = st.rowHeight + 'px';

    const hasIcon = item.iconUrl && item.iconType !== 'none';
    if (!hasIcon) el.classList.add('no-icon');
    else el.classList.add('has-icon');

    const itemSide = item.side || 'left';
    if (itemSide === 'right') el.classList.add('side-right');

    const iconSize = s.iconSize;
    const iconGap = s.iconGap;

    let html = '';
    if (hasIcon) {
      html += `<div class="icon" style="width:${iconSize}px;height:${iconSize}px;margin-right:${iconGap}px;">` +
              `<img src="${item.iconUrl}" alt="" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>`;
    }
    const textShadows = [];
    if (st.strokeWidth > 0) {
      textShadows.push(buildStrokeShadows(st.strokeWidth, st.strokeColor));
    }
    textShadows.push(`${st.shadowX}px ${st.shadowY}px ${st.shadowBlur}px ${st.shadowColor}`);
    const bgCss = st.bgOn
      ? `background:${hexToRgba(st.bgColor, st.bgOpacity)};`
      : '';
    el.style.background = st.bgOn ? hexToRgba(st.bgColor, st.bgOpacity) : 'transparent';
    el.style.borderRadius = (st.bgRadius || 0) + 'px';
    // 右侧玩法反向：视觉顺序 玩法名 → 数量 → 图标
    const namePart = item.name || '';
    // 右侧玩法：数字在前 × 在后（1×）；左侧玩法保持 ×1
    const countText = s.showNumbers && item.count ? (itemSide === 'right' ? `${item.count}×` : `×${item.count}`) : '';
    const countPart = countText ? `<span class="count">${countText}</span>` : '';
    const innerText = itemSide === 'right'
      ? `${namePart} ${countPart}`
      : `${countPart}${countPart ? ' ' : ''}${namePart}`;
    html += `<div class="text" data-id="${item.id}" style="` +
      `display:flex;align-items:center;gap:${iconGap}px;` +
      `font-family:'${st.fontFamily}',sans-serif;` +
      `font-style:${st.fontStyle};` +
      `font-weight:${st.fontWeight};` +
      `font-size:${st.fontSize}px;` +
      `letter-spacing:${st.letterSpacing}px;` +
      `line-height:${st.lineHeight};` +
      `color:${st.textColor};` +
      `text-shadow:${textShadows.filter(t => t !== 'none').join(', ')};` +
      `">${innerText}` +
      `</div>`;
    el.innerHTML = html;
    // 点击图标 → 打开图标选择器
    const iconEl = el.querySelector('.icon');
    if (iconEl) {
      iconEl.style.cursor = 'pointer';
      iconEl.title = '点击更换图标';
      iconEl.onclick = (e) => {
        e.stopPropagation();
        openPicker(item.id);
      };
    }
    // 双击文字 → 画布内联编辑玩法名称
    const inputFontCss = `font-family:'${st.fontFamily}',sans-serif;font-style:${st.fontStyle};font-weight:${st.fontWeight};font-size:${st.fontSize}px;letter-spacing:${st.letterSpacing}px;line-height:${st.lineHeight};color:${st.textColor};`;
    el.ondblclick = (e) => {
      e.stopPropagation();
      const textEl = el.querySelector('.text');
      if (!textEl) return;
      const oldText = item.name || '';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = oldText;
      input.style.cssText = `width:100%;height:100%;border:2px solid #ff69b4;background:rgba(0,0,0,0.7);${inputFontCss}text-align:center;outline:none;padding:0;margin:0;box-sizing:border-box;border-radius:4px;`;
      textEl.style.display = 'none';
      el.appendChild(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (save) => {
        if (done) return; done = true;
        if (save) item.name = input.value;
        input.remove();
        textEl.style.display = '';
        renderMenuItems();
        renderItemsList();
        saveState();
      };
      input.onkeydown = (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
        else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
      };
      input.onblur = () => finish(true);
    };
    el.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { label: '置顶', act: () => adjustItemZ(item.id, 'top') },
        { label: '置底', act: () => adjustItemZ(item.id, 'bottom') },
        { sep: true },
        { label: '上移一层', act: () => adjustItemZ(item.id, 'up') },
        { label: '下移一层', act: () => adjustItemZ(item.id, 'down') },
        { sep: true },
        { label: '切换方向', act: () => { item.side = (item.side || 'left') === 'right' ? 'left' : 'right'; item.x = null; item.y = null; render(); } },
        { label: '删除', act: () => { state.menu.items = state.menu.items.filter(x => x.id !== item.id); render(); } }
      ]);
    };
    container.appendChild(el);
    // 渲染后用浏览器实测宽度/高度缓存起来，给 autoPosition / marquee / 对齐参考线用
    // （autoPosition 走的是 getItemWidth，优先用 _w 实测值）
    item._w = el.offsetWidth;
    item._h = el.offsetHeight;
  });
}

/* ============== Text items render ============== */
function syncTextInputsFromSelection() {
  const id = state.textSelection[0];
  const t = state.textItems.find(it => it.id === id);
  if (!t) return;
  if ($('#text-font-size')) $('#text-font-size').value = t.fontSize;
  if ($('#text-letter-spacing')) $('#text-letter-spacing').value = (t.letterSpacing != null ? t.letterSpacing : 0);
  if ($('#text-color')) $('#text-color').value = t.color;
  if ($('#text-stroke-width')) $('#text-stroke-width').value = t.strokeWidth;
  if ($('#text-stroke-color')) $('#text-stroke-color').value = t.strokeColor || '#000000';
  if ($('#text-font-family')) {
      const sel = $('#text-font-family');
      // 如果当前 fontFamily 不在下拉列表中，把本地字体输入框显示出来
      const known = Array.from(sel.options).map(o => o.value);
      if (t.fontFamily && known.includes(t.fontFamily)) {
        sel.value = t.fontFamily;
        if ($('#text-font-local')) $('#text-font-local').value = '';
      } else if (t.fontFamily) {
        // 不在下拉里，认为是本地字体
        if ($('#text-font-local')) $('#text-font-local').value = t.fontFamily;
        sel.value = '';
      } else {
        sel.value = '';
        if ($('#text-font-local')) $('#text-font-local').value = '';
      }
    }
}

function renderTextItems() {
  const container = $('#text-items');
  if (!container) return;
  container.innerHTML = '';
  state.textItems.forEach(t => {
    const el = document.createElement('div');
    el.className = 'text-item';
    el.dataset.id = t.id;
    if (state.textSelection.includes(t.id)) el.classList.add('selected');
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    if (t.w) el.style.width = t.w + 'px';
    el.style.fontFamily = t.fontFamily ? `'${t.fontFamily}', sans-serif` : 'inherit';
    el.style.fontWeight = t.fontWeight || '900';
    el.style.fontSize = t.fontSize + 'px';
    el.style.letterSpacing = (t.letterSpacing || 0) + 'px';
    el.style.color = t.color;
    el.style.zIndex = t.z || 0;
    el.textContent = t.text || '双击编辑…';
    const sw = t.strokeWidth || 0;
    if (sw > 0) {
      el.style.textShadow = buildStrokeShadows(sw, t.strokeColor || '#000000');
    }
    el.title = '拖拽移动；右下角拉伸手柄调整宽度（决定换行）';
    el.innerHTML += '<button class="del-btn" title="删除">×</button><div class="resize-handle" title="调整宽度"></div>';
    el.querySelector('.del-btn').onclick = (e) => {
      e.stopPropagation();
      state.textItems = state.textItems.filter(it => it.id !== t.id);
      state.textSelection = state.textSelection.filter(x => x !== t.id);
      syncTextInputsFromSelection();
      render();
    };
    el.querySelector('.resize-handle').onmousedown = (e) => {
      e.stopPropagation();
      e.preventDefault();
      const startX = e.clientX;
      const startW = t.w || el.offsetWidth;
      const scale = state.zoom;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const newW = Math.max(40, startW + dx);
        t.w = newW;
        renderTextItems();
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        saveState();
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    };
    el.onclick = (e) => {
      e.stopPropagation();
      if (e.shiftKey || e.ctrlKey || e.metaKey) {
        // 多选：toggle 当前项
        if (state.textSelection.includes(t.id)) {
          state.textSelection = state.textSelection.filter(x => x !== t.id);
        } else {
          state.textSelection = state.textSelection.concat([t.id]);
        }
      } else {
        // 单选：替换
        if (state.textSelection.length === 1 && state.textSelection[0] === t.id) {
          // 已经是当前唯一选中，不动
        } else {
          state.textSelection = [t.id];
        }
      }
      syncTextInputsFromSelection();
      // 不重建 DOM（否则 dblclick 的第二次 click 落在新元素上，dblclick 不触发）
      document.querySelectorAll('.text-item').forEach(x => x.classList.remove('selected'));
      state.textSelection.forEach(id => {
        const sel = document.querySelector('.text-item[data-id="' + id + '"]');
        if (sel) sel.classList.add('selected');
      });
    };
    el.ondblclick = (e) => {
      e.stopPropagation();
      const oldText = t.text || '';
      const input = document.createElement('textarea');
      input.value = oldText;
      const ff = t.fontFamily ? `'${t.fontFamily}',sans-serif` : 'inherit';
      const fw = t.fontWeight || '900';
      const fs = (t.fontSize || 20) + 'px';
      const ls = (t.letterSpacing || 0) + 'px';
      const fg = t.color || '#ffffff';
      input.style.cssText = `width:100%;height:100%;min-height:1.2em;border:2px solid #ff69b4;background:rgba(0,0,0,0.7);font-family:${ff};font-weight:${fw};font-size:${fs};letter-spacing:${ls};color:${fg};text-align:left;outline:none;padding:0 4px;margin:0;box-sizing:border-box;border-radius:4px;resize:none;white-space:pre-wrap;overflow:hidden;`;
      el.textContent = '';
      el.appendChild(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (save) => {
        if (done) return; done = true;
        if (save) t.text = input.value;
        input.remove();
        renderTextItems();
        saveState();
      };
      input.onkeydown = (ev) => {
        if (ev.key === 'Enter' && ev.ctrlKey) return;  // Ctrl+Enter → 插入 \n（让 textarea 自己处理）
        if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
        else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
      };
      input.onblur = () => finish(true);
    };
    el.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      // 右键如果不在多选中，则替换为单选
      if (!state.textSelection.includes(t.id)) state.textSelection = [t.id];
      renderTextItems();
      showCtxMenu(e.clientX, e.clientY, [
        { label: '置顶', act: () => { state.textSelection.forEach(id => adjustTextZ(id, 'top')); render(); } },
        { label: '置底', act: () => { state.textSelection.forEach(id => adjustTextZ(id, 'bottom')); render(); } },
        { sep: true },
        { label: '上移一层', act: () => { state.textSelection.forEach(id => adjustTextZ(id, 'up')); render(); } },
        { label: '下移一层', act: () => { state.textSelection.forEach(id => adjustTextZ(id, 'down')); render(); } },
        { sep: true },
        { label: '删除', act: () => { state.textItems = state.textItems.filter(x => !state.textSelection.includes(x.id)); state.textSelection = []; syncTextInputsFromSelection(); render(); } }
      ]);
    };
    container.appendChild(el);
  });
}

function setupTextItemDrag() {
  const container = $('#text-items');
  if (!container) return;
  let dragging = null, startPt = null, startEls = [];
  container.addEventListener('mousedown', e => {
    if (spaceDown) return;
    const el = e.target.closest('.text-item');
    if (!el) return;
    if (e.target.classList.contains('del-btn')) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    e.stopPropagation();
    e.preventDefault();
    const id = el.dataset.id;
    const item = state.textItems.find(t => t.id === id);
    if (!item) return;
    // 如果点击的 item 已经在选中里，拖拽所有选中的；否则替换为单选后再拖
    if (!state.textSelection.includes(id)) {
      if (!(e.shiftKey || e.ctrlKey || e.metaKey)) {
        state.textSelection = [id];
        syncTextInputsFromSelection();
        document.querySelectorAll('.text-item').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      }
    }
    dragging = id;
    startPt = { x: e.clientX, y: e.clientY };
    // 记录所有选中 item 的起始位置
    startEls = state.textSelection.map(sid => {
      const it = state.textItems.find(t => t.id === sid);
      return it ? { id: sid, x: it.x, y: it.y } : null;
    }).filter(Boolean);
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const scale = state.zoom;
    const dx = (e.clientX - startPt.x) / scale;
    const dy = (e.clientY - startPt.y) / scale;
    // 性能：拖拽时直接改 DOM 的 left/top，不重建 DOM（每帧重建是拖拽卡顿的主因）
    startEls.forEach(rec => {
      const it = state.textItems.find(t => t.id === rec.id);
      if (!it) return;
      it.x = rec.x + dx;
      it.y = rec.y + dy;
      const dom = container.querySelector('.text-item[data-id="' + rec.id + '"]');
      if (dom) {
        dom.style.left = it.x + 'px';
        dom.style.top = it.y + 'px';
      }
    });
  });
  window.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = null;
      startEls = [];
      // 拖拽结束后再统一重排/对齐/持久化
      renderTextItems();
      saveState();
    }
  });
}

function autoPosition(item, idx) {
  const s = state.style;
  const st = getEffectiveStyle(item);
  const colWidth = st.colWidth;
  const rowH = st.rowHeight;
  const gap = st.rowGap;
  const side = item.side || 'left';
  const leftX = s.leftX;
  // 右侧玩法右边缘贴右边距 40：x = canvas.width - 40 - 自适应宽度
  // 左侧玩法 x 固定在 leftX：宽度自适应撑开
  const estW = getItemWidth(item, st);
  const rightEdge = state.canvas.width - 40;
  const baseX = side === 'left' ? leftX : (rightEdge - estW);
  const sameSide = state.menu.items.filter(it => (it.side || 'left') === side);
  const idxInSide = sameSide.indexOf(item);
  return { x: baseX, y: s.topY + idxInSide * (rowH + gap) };
}

// 用 canvas measureText 估算文字宽度，给 autoPosition / marquee / 对齐参考线用
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
function measureTextWidth(text, st) {
  _measureCtx.font = `${st.fontWeight || 900} ${st.fontSize || 32}px '${st.fontFamily || ''}', ${st.fontFamily ? 'sans-serif' : 'sans-serif'}`;
  let w = _measureCtx.measureText(text || '').width;
  if (st.letterSpacing) w += Math.max(0, (text || '').length - 1) * st.letterSpacing;
  return w;
}
// 估算 menu-item 的总宽度：图标 + iconGap + count + name + padding
// 渲染时浏览器会用 offsetWidth 实测，本函数给"未渲染"阶段（autoPosition/marquee/对齐）使用
function getItemWidth(item, st) {
  // 优先用 renderMenuItems 渲染后缓存的实际宽度
  if (item._w && item._w > 0) return item._w;
  const hasIcon = item.iconUrl && item.iconType !== 'none';
  const iconW = hasIcon ? (st.iconSize || 0) : 0;
  const iconGap = hasIcon ? (st.iconGap || 0) : 0;
  let nameW = measureTextWidth(item.name || '', st);
  let countText = '';
  if (st.showNumbers && item.count) {
    countText = (item.side || 'left') === 'right' ? `${item.count}×` : `×${item.count}`;
  }
  const countW = countText ? measureTextWidth(countText, st) + 6 : 0;
  // padding 估算：左右各 10px（CSS 已对齐）
  return Math.ceil(iconW + iconGap + countW + nameW + 20);
}

/* ============== Image items ============== */
function renderImageLibrary() {
  const lib = $('#image-lib');
  if (!lib) return;
  lib.innerHTML = '';
  state.imageLibrary.forEach((entry, idx) => {
    const cell = document.createElement('div');
    cell.className = 'lib-cell';
