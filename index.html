<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>B站直播菜单生成器</title>
<style id="early-source-style">
/* Source mode 早期注入（在 CEF 第一帧渲染前生效） */
html.is-source, html.is-source body { background: transparent !important; background-color: transparent !important; background-image: none !important; }
html.is-source *::-webkit-scrollbar { display: none !important; }
</style>
<script>
/* Source mode 早期判定 + 给 <html> 加 class，避免 CEF 第一帧读到 --bg: #ffffff */
(function(){
  try {
    var p = location.search;
    var isSource = /[?&]s(&|$|=)/.test(p) || /[?&](source|phone)=1(&|$|.)/.test(p);
    if (isSource) document.documentElement.classList.add('is-source');
  } catch(e){}
})();
</script>
<script defer src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --panel: #f6f6f8;
  --panel-2: #ececed;
  --text: #1a1a1f;
  --text-dim: #6b6b73;
  --accent: #ff5ca7;
  --accent-2: #00aeec;
  --border: #e0e0e5;
  --danger: #e5484d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; }

/* === Layout === */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
#sidebar-right { width: 280px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { height: 48px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
#canvas-wrap { flex: 1; overflow: auto; position: relative; background: var(--panel-2); min-height: 0; padding: 24px; }
#canvas-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
#canvas-wrap::-webkit-scrollbar-thumb { background: #5a5a5a; border-radius: 5px; }
#canvas-wrap::-webkit-scrollbar-thumb:hover { background: #777; }
#canvas-wrap::-webkit-scrollbar-track { background: var(--panel-2); }
#canvas-scroll-inner { position: relative; min-width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; }

/* === Sidebar sections === */
.section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.section h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row label { flex: 0 0 80px; color: var(--text-dim); font-size: 12px; }
.row .ctrl { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row input[type="text"], .row input[type="number"], .row select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; }
.row input[type="color"] { width: 36px; height: 26px; padding: 0; border: 1px solid var(--border); background: transparent; border-radius: 4px; cursor: pointer; }
.row.check label { flex: 1; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }

/* === Buttons === */
.btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; font-size: 12px; }
.btn:hover { background: #e3e3e8; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #ff5ca7; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 3px 8px; font-size: 11px; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.has-update { background: #ff8a3d; border-color: #ff8a3d; color: #fff; animation: wbPulse 1.6s ease-in-out infinite; }
.btn.has-update:hover { background: #ff7a1f; }
@keyframes wbPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,138,61,0.5); } 50% { box-shadow: 0 0 0 6px rgba(255,138,61,0); } }

/* === Topbar === */
#topbar h1 { font-size: 14px; font-weight: 600; }
#topbar .spacer { flex: 1; }
.zoom-group { display: flex; align-items: center; gap: 4px; padding: 0 10px; border-right: 1px solid var(--border); margin-right: 4px; }
.zoom-group #zoom-label { min-width: 46px; text-align: center; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.zoom-group .btn.small { padding: 2px 9px; font-size: 14px; line-height: 1; }

/* === Canvas === */
/* 画布容器：深灰底，溢出隐藏（用 scrollLeft/Top 平移） */
#canvas-viewport { position: relative; flex-shrink: 0; }
/* scaler：承载缩放变换，尺寸=画布原始尺寸，用 transform: scale 缩放 */
#stage-scaler { position: relative; transform-origin: 0 0; }
/* stage：画布本体，1080×1920 或 1920×1080，透明底 + 格子参考线 */
#stage {
  position: relative;
  background-color: transparent;
  background-image:
    linear-gradient(45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.06) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.06) 75%);
  background-size: 32px 32px;
  background-position: 0 0, 0 16px, 16px -16px, -16px 0;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}
#stage-frame { position: absolute; inset: 0; border: 1px dashed rgba(0,0,0,0.12); pointer-events: none; }
#safe-area { position: absolute; border: 1px dashed rgba(255, 105, 180, 0.5); pointer-events: none; display: none; }
#safe-area::before { content: "安全线"; position: absolute; top: -18px; left: 0; font-size: 10px; color: var(--accent); background: #fff; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; }
#cover-mask { position: absolute; left: 0; top: 0; width: 200px; height: 100px; background: #2a2a2a; pointer-events: none; display: none; }
body.mode-horizontal #cover-mask { display: block; }
#menu { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: default; user-select: none; }
#menu.dragging { cursor: grabbing; }
#menu-items { position: absolute; inset: 0; z-index: 1; }

/* 图片置底专用容器：在玩法容器（z=1）和文字容器（z=2）之下，但在画布背景之上 */
#image-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#image-bg .image-item { pointer-events: auto; }

.menu-item {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow: visible;
  background: transparent;
  cursor: grab;
  padding: 4px 10px;
  border-radius: 0;
}
.menu-item.side-right { justify-content: flex-end; }
.menu-item.side-right.has-icon .icon { margin-right: 0; margin-left: 6px; order: 2; }
.menu-item.side-right.has-icon .text { order: 1; }
.menu-item:active { cursor: grabbing; }
.menu-item.selected { outline: 2px solid #4da3ff; outline-offset: 3px; z-index: 6; }
#guide-v { position: absolute; top: 0; width: 0; border-left: 1px dashed #ff3b30; z-index: 60; pointer-events: none; display: none; }
#guide-h { position: absolute; left: 0; height: 0; border-top: 1px dashed #ff3b30; z-index: 60; pointer-events: none; display: none; }
#menu, #menu-items, .menu-item, .menu-item .text, .menu-item .name, .menu-item .icon, .menu-item .icon img { overflow: visible; }
#marquee { position: absolute; border: 1px solid #4da3ff; background: rgba(77,163,255,0.15); pointer-events: none; z-index: 40; }

.menu-item .icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.menu-item .icon img { width: 100%; height: 100%; object-fit: contain; }
@keyframes iconBreathe {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.06) translateY(-2px); }
}
.menu-item .icon { animation: iconBreathe 2.4s ease-in-out infinite; transform-origin: center center; }
.menu-item:nth-child(5n+1) .icon { animation-delay: 0s; }
.menu-item:nth-child(5n+2) .icon { animation-delay: 0.25s; }
.menu-item:nth-child(5n+3) .icon { animation-delay: 0.5s; }
.menu-item:nth-child(5n+4) .icon { animation-delay: 0.75s; }
.menu-item:nth-child(5n+5) .icon { animation-delay: 1s; }
.menu-item.selected .icon { animation-play-state: paused; }
.menu-item .text { display: flex; align-items: center; min-width: 0; flex: 1; overflow: visible; width: 100%; height: 100%; }
.menu-item .count { flex-shrink: 0; }
.menu-item .name { white-space: nowrap; overflow: visible; text-overflow: clip; }
.menu-item.no-icon .text { flex: 1; }

/* === Text items (独立文字对象) === */
#text-items { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.text-item {
  position: absolute;
  display: block;
  cursor: grab;
  white-space: pre;          /* 保留 \n 换行，不自动换行（按字数自适应宽） */
  overflow: visible;
  padding: 4px 8px;
  border: 1px dashed transparent;
  pointer-events: auto;
  box-sizing: border-box;
  min-width: 24px;
  min-height: 24px;
}
.text-item:active { cursor: grabbing; }
.text-item.selected { border-color: #4da3ff; outline-offset: 3px; }
.text-item .del-btn {
  position: absolute; top: -10px; right: -10px;
  background: #e5484d; color: #fff; border: none; border-radius: 50%;
  width: 22px; height: 22px; line-height: 1; cursor: pointer; display: none;
  font-size: 12px;
}
.text-item.selected .del-btn { display: flex; align-items: center; justify-content: center; }
.text-item .resize-handle {
  position: absolute;
  right: -2px; bottom: -2px;
  width: 12px; height: 12px;
  background: #4da3ff;
  border: 1px solid #fff;
  border-radius: 2px;
  cursor: nwse-resize;
  display: none;
  z-index: 2;
}
.text-item.selected .resize-handle { display: block; }

.text-item:active { cursor: grabbing; }
.text-item.selected { border-color: #4da3ff; outline-offset: 3px; }
.text-item .del-btn {
  position: absolute; top: -10px; right: -10px;
  background: #e5484d; color: #fff; border: none; border-radius: 50%;
  width: 22px; height: 22px; line-height: 1; cursor: pointer; display: none;
  font-size: 12px;
}
.text-item.selected .del-btn { display: flex; align-items: center; justify-content: center; }

/* === Image items (独立图片对象) === */
#image-items { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.image-item {
  position: absolute;
  display: block;
  cursor: grab;
  pointer-events: auto;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-drag: none;
}
.image-item:active { cursor: grabbing; }
.image-item.locked { cursor: default; }
.image-item.selected { outline: 2px solid #4da3ff; outline-offset: 3px; }
.image-item.locked { outline: 2px dashed #ffa940; outline-offset: 3px; }
.image-item.locked.selected { outline: 2px solid #ffa940; }
.image-item .lock-badge {
  position: absolute; top: -10px; right: -10px;
  background: #ffa940; color: #fff;
  border: 2px solid #fff; border-radius: 12px;
  padding: 2px 8px; font-size: 12px; font-weight: 700;
  display: none; z-index: 100; pointer-events: auto; line-height: 1.4;
  cursor: pointer; user-select: none; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: background 0.15s, transform 0.1s;
}
.image-item .lock-badge:hover { background: #ffc069; transform: scale(1.08); }
.image-item .lock-badge:active { background: #d46f08; transform: scale(0.95); }
.image-item.locked .lock-badge { display: block; }
.image-item.locked .resize-handle { display: none !important; }
.image-item img { width: 100%; height: 100%; display: block; pointer-events: none; object-fit: fill; -webkit-user-drag: none; user-select: none; }
.image-item .del-btn {
  position: absolute; top: -10px; right: -10px;
  background: #e5484d; color: #fff; border: none; border-radius: 50%;
  width: 22px; height: 22px; line-height: 1; cursor: pointer; display: none;
  font-size: 12px; z-index: 4;
}
.image-item.selected .del-btn { display: flex; align-items: center; justify-content: center; }
.image-item.locked .del-btn { display: flex; align-items: center; justify-content: center; }
.image-item .resize-handle {
  position: absolute;
  width: 12px; height: 12px;
  background: #4da3ff;
  border: 1px solid #fff;
  border-radius: 2px;
  display: none;
  z-index: 3;
}
.image-item.selected .resize-handle { display: block; }
.image-item .rh-tl { top: -2px; left: -2px; cursor: nwse-resize; }
.image-item .rh-tr { top: -2px; right: -2px; cursor: nesw-resize; }
.image-item .rh-bl { bottom: -2px; left: -2px; cursor: nesw-resize; }
.image-item .rh-br { bottom: -2px; right: -2px; cursor: nwse-resize; }
.image-item .rh-t { top: -2px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
.image-item .rh-b { bottom: -2px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
.image-item .rh-l { left: -2px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
.image-item .rh-r { right: -2px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

/* === Image library === */
.image-lib { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 200px; overflow-y: auto; padding: 4px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; }
.image-lib .lib-cell { aspect-ratio: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s; }
.image-lib .lib-cell:hover { border-color: var(--accent); }
.image-lib .lib-cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
.image-lib .lib-cell .lib-del { position: absolute; top: 2px; right: 2px; background: rgba(229,72,77,0.9); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: none; line-height: 1; }
.image-lib .lib-cell { position: relative; }
.image-lib .lib-cell:hover .lib-del { display: flex; align-items: center; justify-content: center; }
.image-lib .lib-cell .lib-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; text-align: center; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* === Context menu (right-click z-index) === */
.ctx-menu { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 0; min-width: 140px; z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.ctx-menu .ctx-item { padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
.ctx-menu .ctx-item:hover { background: var(--accent); color: #fff; }
.ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* === Items list === */
.items-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; background: var(--panel-2); }
.item-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.item-row:last-child { border-bottom: none; }
.item-row .ico { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.item-row .ico img { width: 100%; height: 100%; object-fit: contain; }
.item-row .nm { flex: 1; font-size: 12px; background: transparent; border: 1px solid transparent; color: var(--text); padding: 2px 4px; border-radius: 3px; min-width: 0; }
.item-row .nm:hover { border-color: var(--border); }
.item-row .nm:focus { border-color: var(--accent); background: var(--bg); outline: none; }
.item-row .ct { width: 44px; }
.item-row .ct input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 2px 4px; border-radius: 3px; font-size: 11px; }
.item-row .acts { display: flex; gap: 3px; }
.item-row .acts button { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 2px 5px; border-radius: 3px; font-size: 10px; }
.item-row .acts button:hover { color: var(--text); border-color: var(--text-dim); }
.item-row .side-toggle { flex-shrink: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer; min-width: 22px; }
.item-row .side-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* === Modal === */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-back.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: 90vw; max-width: 960px; height: 80vh; max-height: 720px; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.modal-head h2 { font-size: 14px; font-weight: 600; }
.modal-head .spacer { flex: 1; }
.modal-head .close { background: transparent; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0 6px; }
.modal-head .close:hover { color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.icon-cell { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: border-color 0.15s; }
.icon-cell:hover { border-color: var(--accent); }
.icon-cell.selected { border-color: var(--accent); background: rgba(255,105,180,0.1); }
.icon-cell .img-wrap { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.icon-cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
.icon-cell .nm { font-size: 11px; color: var(--text-dim); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-cell .badge { font-size: 9px; color: var(--accent-2); font-weight: 600; }

/* === Upload === */
.upload { display: inline-block; padding: 5px 10px; border: 1px dashed var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; font-size: 12px; }
.upload:hover { border-color: var(--accent); color: var(--text); }
.upload input { display: none; }

/* === Status bar === */
#status { padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
#status .pill { padding: 2px 8px; background: var(--panel-2); border-radius: 10px; }

/* === Pan mode === */
body.pan-ready #canvas-wrap { cursor: grab; }
body.panning { cursor: grabbing !important; user-select: none; }
body.panning * { cursor: grabbing !important; }

/* === Source mode (browser source for OBS / B站直播姬) === */
html.is-source, html.is-source body, body.source-mode, body.source-mode #app, body.source-mode #main, body.source-mode #canvas-wrap, body.source-mode #canvas-viewport, body.source-mode #stage-scaler, body.source-mode #stage { background: transparent !important; background-color: transparent !important; background-image: none !important; }
body.source-mode #sidebar, body.source-mode #sidebar-right, body.source-mode #topbar, body.source-mode #status { display: none !important; }
body.source-mode, html.is-source { overflow: hidden; }
body.source-mode #canvas-wrap { overflow: hidden !important; padding: 0 !important; }
body.source-mode #canvas-scroll-inner { min-width: 100%; min-height: 100%; }
body.source-mode #stage-scaler { position: absolute; }
body.source-mode #stage { border: none !important; box-shadow: none !important; }
body.source-mode #stage-frame { display: none !important; }
body.source-mode #cover-mask { display: none !important; }

/* === iPhone B站前景覆盖层 === */
#phone-overlay {
  position: absolute; inset: 0; pointer-events: none; z-index: 30; display: none;
  overflow: hidden;
}
body.phone-overlay-on #phone-overlay { display: block; }
body.source-mode #phone-overlay { display: none !important; }
body.mode-horizontal #phone-overlay { display: none !important; }

/* ============ 歌单整理工具（独立画布） ============ */
#pl-open-btn { width: 100%; margin-bottom: 2px; }
#pl-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 300; }
#pl-modal.open { display: flex; align-items: center; justify-content: center; }
#pl-modal .pl-sheet {
  width: min(1400px, 97vw); height: min(880px, 95vh);
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 60px rgba(0,0,0,0.3);
}
.pl-head {
  height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel);
}
.pl-head h2 { font-size: 14px; font-weight: 700; }
.pl-head .pl-hint { font-size: 11px; color: var(--text-dim); }
.pl-head .spacer { flex: 1; }
.pl-head .close {
  width: 28px; height: 28px; border: none; background: transparent; color: var(--text-dim);
  font-size: 20px; line-height: 1; border-radius: 5px;
}
.pl-head .close:hover { background: var(--panel-2); color: var(--text); }
.pl-body { flex: 1; display: flex; min-height: 0; }

/* 左：输入 */
.pl-col-plain { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.pl-col-plain h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 12px 14px 8px; }
#pl-text {
  flex: 1; margin: 0 12px; min-height: 0; resize: none; padding: 10px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
  color: var(--text); line-height: 1.7; font-size: 13px;
}
.pl-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; }
.pl-tools button {
  flex: 1 1 auto; min-width: 68px; padding: 5px 8px; font-size: 12px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 5px;
}
.pl-tools button:hover { background: var(--panel); border-color: var(--accent); color: var(--accent); }
.pl-stat { padding: 0 14px 12px; font-size: 11px; color: var(--text-dim); }

/* 中：独立画布 */
.pl-canvas-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel-2); }
.pl-canvas-bar { height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--text-dim); }
.pl-canvas-bar select { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
.pl-canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; }
/* 预览底色（只影响编辑预览，不写进导出的 PNG） */
.pl-canvas-wrap.pv-dark { background: #2b2b30; }
.pl-canvas-wrap.pv-light { background: #d8d8dd; }
.pl-canvas-wrap.pv-checker {
  background-color: #cfcfcf;
  background-image:
    linear-gradient(45deg, #9a9a9a 25%, transparent 25%, transparent 75%, #9a9a9a 75%),
    linear-gradient(45deg, #9a9a9a 25%, transparent 25%, transparent 75%, #9a9a9a 75%);
  background-size: 20px 20px;
  background-position: 0 0, 10px 10px;
}
#pl-canvas { display: block; background: transparent; box-shadow: 0 4px 24px rgba(0,0,0,0.14); flex-shrink: 0; }

/* 右：样式 */
.pl-col-style { width: 258px; flex-shrink: 0; border-left: 1px solid var(--border); overflow-y: auto; padding: 12px 14px; }
.pl-col-style h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; margin: 4px 0 10px; }
.pl-col-style .row { margin-bottom: 8px; }
.pl-col-style .row label { flex: 0 0 74px; font-size: 12px; color: var(--text-dim); }
.pl-col-style .row .ctrl { flex: 1; }
.pl-col-style input[type="number"], .pl-col-style input[type="text"], .pl-col-style select {
  width: 100%; padding: 4px 7px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg); color: var(--text);
}
.pl-col-style input[type="color"] { width: 100%; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
.pl-sep { height: 1px; background: var(--border); margin: 12px 0; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="section">
      <button class="btn small primary" id="pl-open-btn" title="打开歌单整理工具（独立画布，不影响菜单画布）">🎵 歌单整理工具</button>
    </div>

    <div class="section">
      <h3>画布尺寸</h3>
      <div class="row">
        <label>布局</label>
        <div class="ctrl">
          <select id="mode-select">
            <option value="vertical">竖版 1080×1920</option>
            <option value="horizontal">横版 1920×1080</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>菜单玩法项</h3>
      <div class="row" style="margin-bottom: 6px;">
        <button class="btn small primary" id="add-item">+ 添加项</button>
        <button class="btn small" id="clear-items">清空</button>
      </div>
      <div class="row" style="margin-bottom: 6px;">
        <button class="btn small" id="check-icon-update" title="从 gift.shuvi.moe 拉取新礼物图标，补充到「选择礼物图标」库里（不改动菜单玩法项）">🔄 检查更新</button>
        <span id="icon-update-status" style="font-size:11px;color:var(--text-dim);margin-left:6px;"></span>
      </div>
      <div class="items-list" id="items-list"></div>
    </div>

    <div class="section">
      <h3>选区专属样式</h3>
      <div class="row">
        <label>字号</label>
        <div class="ctrl"><input type="number" id="sel-font-size" min="6" max="120" value="12"></div>
      </div>
      <div class="row">
        <label>字重</label>
        <div class="ctrl">
          <select id="sel-font-weight">
            <option value="400">正常</option>
            <option value="900" selected>加粗</option>
          </select>
        </div>
      </div>
      <div class="row">
        <label>字体</label>
        <div class="ctrl">
          <select id="sel-font-family">
            <option value="system-ui">系统默认</option>
            <option value="PingFang SC">苹方</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="SimHei">黑体</option>
            <option value="SimSun">宋体</option>
            <option value="KaiTi">楷体</option>
            <option value="FangSong">仿宋</option>
            <option value="JinNanYuanTi">荆南圆体</option>
            <option value="CangErShuYuanTi">苍耳舒圆体</option>
            <option value="custom-font">选择本地电脑字体…</option>
          </select>
          <input type="file" id="sel-font-file" accept=".ttf,.otf,.woff,.woff2" style="display:none;">
        </div>
      </div>
      <div class="row">
        <label>描边色</label>
        <div class="ctrl"><input type="color" id="sel-stroke-color" value="#000000"></div>
      </div>
      <div class="row">
        <label>描边粗细</label>
        <div class="ctrl"><input type="number" id="sel-stroke-width" min="0" max="20" value="1"></div>
      </div>
      <div class="row">
        <label>阴影 X</label>
        <div class="ctrl"><input type="number" id="sel-shadow-x" min="-20" max="20" value="1"></div>
      </div>
      <div class="row">
        <label>阴影 Y</label>
        <div class="ctrl"><input type="number" id="sel-shadow-y" min="-20" max="20" value="-1"></div>
      </div>
      <div class="row">
        <label>阴影模糊</label>
        <div class="ctrl"><input type="number" id="sel-shadow-blur" min="0" max="30" value="5"></div>
      </div>
      <div class="row">
        <label>阴影色</label>
        <div class="ctrl"><input type="color" id="sel-shadow-color" value="#000000"></div>
      </div>
      <div class="row">
        <label>文字色</label>
        <div class="ctrl"><input type="color" id="sel-text-color" value="#ffffff"></div>
      </div>
      <div class="row">
        <label>字间距</label>
        <div class="ctrl"><input type="number" id="sel-letter-spacing" min="-5" max="20" value="2"></div>
      </div>
      <div class="row">
        <label>上下间距</label>
        <div class="ctrl"><input type="number" id="sel-row-gap" min="-30" max="60" value="5"></div>
      </div>
      <div class="row">
        <label>行高</label>
        <div class="ctrl"><input type="number" id="sel-row-height" min="30" max="200" value="40"></div>
      </div>
      <div class="row check">
        <label><input type="checkbox" id="sel-show-bg" checked> 显示背景</label>
      </div>
      <div class="row">
        <label>背景色</label>
        <div class="ctrl" style="display:flex; gap:14px; align-items:center;">
          <input type="color" id="sel-bg-color" value="#000000" style="width:36px;flex:0;">
          <span style="font-size:12px;color:var(--text-dim);">圆角</span>
          <input type="number" id="sel-bg-radius" min="0" max="80" value="24" style="width:60px;flex:0;">
        </div>
      </div>
      <div class="row">
        <label>背景透明</label>
        <div class="ctrl"><input type="number" id="sel-bg-opacity" min="0" max="100" value="100"></div>
      </div>
      <div class="row">
        <label>对齐方式</label>
        <div class="ctrl btn-group">
          <button class="btn small" id="sel-align-left" title="左对齐">左对齐</button>
          <button class="btn small" id="sel-align-right" title="右对齐">右对齐</button>
          <button class="btn small" id="sel-align-top" title="上对齐">上对齐</button>
          <button class="btn small" id="sel-align-bottom" title="下对齐">下对齐</button>
        </div>
      </div>
      <div class="row"><span class="hint">鼠标框选后生效（Shift+点击加/减选）</span></div>
    </div>

    <div class="section">
      <h3>数字</h3>
      <div class="row check">
        <label><input type="checkbox" id="show-numbers" checked> 显示数量</label>
      </div>
      <div class="row" id="count-edit-row" style="display:none;">
        <label>数量</label>
        <div class="ctrl"><input type="number" id="item-count" min="0" max="999" value="1"></div>
      </div>
      <div class="row">
        <div class="ctrl btn-group">
          <button class="btn small" id="reset-layout" title="把所有玩法项回到双栏自动位置">重排所有玩法</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>图标</h3>
      <div class="row">
        <label>图标尺寸</label>
        <div class="ctrl"><input type="number" id="icon-size" min="0" max="120" value="44"></div>
      </div>
      <div class="row">
        <label>图标间距</label>
        <div class="ctrl"><input type="number" id="icon-gap" min="0" max="40" value="0" step="1"></div>
      </div>
    </div>

  </aside>

  <div id="main">
    <div id="topbar">
      <h1>B站直播菜单生成器</h1>
      <div class="spacer"></div>
      <div class="zoom-group">
        <button class="btn small" id="zoom-out" title="缩小">−</button>
        <span id="zoom-label" title="Alt+滚轮 缩放 · Space+拖动 平移">100%</span>
        <button class="btn small" id="zoom-in" title="放大">＋</button>
        <button class="btn small" id="zoom-fit" title="适应窗口">适应</button>
      </div>
      <button class="btn" id="show-safe">显示安全线</button>
      <button class="btn" id="clear-all" title="清空画布上的全部玩法、文字、图片">清空所有</button>
      <select id="open-overlay" class="btn" style="padding: 4px 8px;">
        <option value="off">📱 手机预览</option>
        <option value="iphone">iPhone 安全区</option>
        <option value="android">安卓安全区</option>
      </select>
      <button class="btn primary" id="copy-source">复制浏览器源链接</button>
      <button class="btn primary" id="export-png">导出透明 PNG</button>
    </div>
    <div id="canvas-wrap">
      <div id="canvas-scroll-inner">
      <div id="canvas-viewport">
        <div id="stage-scaler">
          <div id="stage">
            <div id="stage-frame"></div>
            <div id="safe-area"></div>
            <div id="cover-mask"></div>
            <div id="menu">
              <div id="image-bg"></div>
              <div id="menu-items"></div>
              <div id="text-items"></div>
              <div id="image-items"></div>
            </div>
            <div id="marquee" style="display:none;"></div>
            <div id="guide-v"></div>
            <div id="guide-h"></div>
            <div id="phone-overlay">
              <svg id="safe-mask-svg" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;pointer-events:none;">
                <defs>
                  <mask id="safe-mask-iphone">
                    <image href="iphone_safe.png" width="100%" height="100%" preserveAspectRatio="none" />
                  </mask>
                  <mask id="safe-mask-android">
                    <image href="android_safe.png" width="100%" height="100%" preserveAspectRatio="none" />
                  </mask>
                </defs>
                <rect id="safe-rect-iphone" x="0" y="0" width="100%" height="100%" fill="rgba(0,0,0,0.55)" mask="url(#safe-mask-iphone)" style="display:none;" />
                <rect id="safe-rect-android" x="0" y="0" width="100%" height="100%" fill="rgba(0,0,0,0.55)" mask="url(#safe-mask-android)" style="display:none;" />
              </svg>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <div id="status">
      <span>画布: <span id="status-canvas">1080×1920</span></span>
      <span>菜单: <span id="status-pos">0, 0</span></span>
      <span>项数: <span id="status-count">0</span></span>
      <span class="pill" id="status-mode">编辑器</span>
    </div>
  </div>

  <aside id="sidebar-right">
    <div class="section">
      <h3>文字</h3>
      <div class="row" style="margin-bottom: 6px;">
        <button class="btn small primary" id="add-text">+ 添加文字</button>
      </div>
      <div class="row">
        <label>字号</label>
        <div class="ctrl"><input type="number" id="text-font-size" min="6" max="200" value="20"></div>
      </div>
      <div class="row">
        <label>字间距</label>
        <div class="ctrl"><input type="number" id="text-letter-spacing" min="-5" max="30" value="2" step="0.5"></div>
      </div>
      <div class="row">
        <label>字色</label>
        <div class="ctrl"><input type="color" id="text-color" value="#ffffff"></div>
      </div>
      <div class="row">
        <label>描边宽</label>
        <div class="ctrl"><input type="number" id="text-stroke-width" min="0" max="20" value="2"></div>
      </div>
      <div class="row">
        <label>描边色</label>
        <div class="ctrl"><input type="color" id="text-stroke-color" value="#000000"></div>
      </div>
      <div class="row">
        <label>字体</label>
        <div class="ctrl" style="display:flex; gap:6px; align-items:center;">
          <select id="text-font-family" style="flex:1; min-width:0;">
            <option value="">系统默认</option>
            <option value="PingFang SC">苹方</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="SimHei">黑体</option>
            <option value="SimSun">宋体</option>
            <option value="KaiTi">楷体</option>
            <option value="FangSong">仿宋</option>
            <option value="JinNanYuanTi">荆南圆体</option>
            <option value="CangErShuYuanTi">苍耳舒圆体</option>
          </select>
          <input type="text" id="text-font-local" placeholder="本机字体" style="flex:1; min-width:0;">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>图片</h3>
      <div class="row" style="margin-bottom: 6px;">
        <button class="btn small" id="upload-image-btn">+ 上传图片</button>
        <button class="btn small" id="unlock-all-btn" title="解锁画布上所有锁定的图片" style="margin-left: 6px;">解锁全部</button>
        <button class="btn small" id="clear-images-btn" title="清空画布上的全部图片" style="margin-left: 6px;">清空</button>
        <input type="file" id="upload-image-input" accept="image/*" style="display:none;">
      </div>
      <div class="row" style="margin-bottom: 6px; font-size: 12px; color: var(--text-2);">点击库内图片加到画布中央</div>
      <div class="image-lib" id="image-lib"></div>
      <div class="row"><span class="hint">画布上：拖动平移、4 角等比缩放（按住 Shift 自由拉伸）、4 边自由拉伸，右键可调整图层顺序。</span></div>
    </div>
  </aside>
</div>

<div class="modal-back" id="picker-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>选择礼物图标</h2>
      <input type="text" id="picker-search" placeholder="搜索礼物名称..." style="background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 4px; width: 240px;">
      <span style="font-size: 12px; color: var(--text-dim);">静态图</span>
      <span class="spacer"></span>
      <label class="upload" style="margin: 0;">
        上传自定义
        <input type="file" id="picker-upload" accept="image/*">
      </label>
      <button class="close" id="picker-close">×</button>
    </div>
    <div class="modal-body">
      <div class="icon-grid" id="picker-grid"></div>
    </div>
  </div>
</div>

<!-- ============ 歌单整理工具（独立画布） ============ -->
<div id="pl-modal">
  <div class="pl-sheet">
    <div class="pl-head">
      <h2>🎵 歌单整理工具</h2>
      <span class="pl-hint">独立画布 · 与菜单画布互不影响</span>
      <span class="spacer"></span>
      <button class="btn small" id="pl-save">保存</button>
      <button class="btn small" id="pl-export">导出 PNG</button>
      <button class="btn small primary" id="pl-download-txt">导出 TXT</button>
      <button class="close" id="pl-close">×</button>
    </div>
    <div class="pl-body">
      <!-- 左：歌曲列表输入 -->
      <div class="pl-col-plain">
        <h3>歌曲列表（一行一首）</h3>
        <textarea id="pl-text" placeholder="直接粘贴歌名，一行一首。&#10;&#10;例：&#10;晴天&#10;稻香&#10;七里香&#10;&#10;带风格（用 | 分隔，右侧可选谁在前）：&#10;古风|青花瓷&#10;流行|晴天&#10;&#10;也支持带序号：1. 晴天（会自动清理）"></textarea>
        <div class="pl-tools">
          <button data-op="trim" title="删掉所有空行">去空行</button>
          <button data-op="dedup" title="删掉重复歌名（保留首次出现）">去重</button>
          <button data-op="clean" title="清掉行首序号 / 时长 / 多余空格">清格式</button>
          <button data-op="sort" title="按拼音/字母排序">排序</button>
          <button data-op="shuffle" title="随机打乱">乱序</button>
          <button data-op="reverse" title="倒序">倒序</button>
        </div>
        <div class="pl-stat" id="pl-stat">0 首</div>
      </div>

      <!-- 中：独立画布 -->
      <div class="pl-canvas-col">
        <div class="pl-canvas-bar">
          <label>画布</label>
          <select id="pl-size">
            <option value="1080x1920">竖版 1080×1920</option>
            <option value="1920x1080">横版 1920×1080</option>
            <option value="1080x1080">方形 1080×1080</option>
            <option value="720x1280">竖版 720×1280</option>
          </select>
          <span style="flex:1;"></span>
          <label>预览缩放</label>
          <select id="pl-zoom">
            <option value="0.25">25%</option>
            <option value="0.35" selected>35%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
          </select>
          <label>预览底色</label>
          <select id="pl-preview-bg" title="只影响编辑时的预览，不写进导出的 PNG">
            <option value="dark" selected>深灰</option>
            <option value="light">浅灰</option>
            <option value="checker">透明棋盘</option>
          </select>
        </div>
        <div class="pl-canvas-wrap">
          <canvas id="pl-canvas"></canvas>
        </div>
      </div>

      <!-- 右：样式 -->
      <div class="pl-col-style">
        <h3>排列方式</h3>
        <div class="row"><label>排列</label><div class="ctrl">
          <select id="pl-arrange" title="按字数：一个字一组、两个字一组…；按风格+字数：先分风格，风格内再按字数排">
            <option value="order">保持输入顺序</option>
            <option value="len">按字数分组</option>
            <option value="style">按风格 + 字数</option>
          </select>
        </div></div>
        <div class="row"><label>风格写法</label><div class="ctrl">
          <select id="pl-style-pos" title="用 | 或 ｜ 分隔风格与歌名；也支持 [风格]歌名 自动识别">
            <option value="before">风格｜歌名</option>
            <option value="after">歌名｜风格</option>
          </select>
        </div></div>
        <div class="row"><label>分组标题</label><div class="ctrl"><input type="checkbox" id="pl-show-group" checked></div></div>
        <div class="row"><label>标题字号</label><div class="ctrl"><input type="number" id="pl-group-fs" min="8" max="160" value="34"></div></div>
        <div class="row"><label>标题色</label><div class="ctrl"><input type="color" id="pl-group-color" value="#00aeec"></div></div>

        <div class="pl-sep"></div>
        <h3>字号 / 行</h3>
        <div class="row"><label>字号</label><div class="ctrl"><input type="number" id="pl-fs" min="8" max="160" value="28"></div></div>
        <div class="row"><label>行高</label><div class="ctrl"><input type="number" id="pl-lh" min="1" max="4" step="0.05" value="1.6"></div></div>
        <div class="row"><label>列数</label><div class="ctrl"><input type="number" id="pl-cols" min="1" max="4" value="1"></div></div>

const $ = (sel, root = document) => root.querySelector(sel);
