      item.x = pos.x;
      item.y = pos.y + 10;
      render();
    };
    row.querySelector('.del').onclick = () => {
      state.menu.items = state.menu.items.filter(it => it.id !== item.id);
      state.selection = state.selection.filter(id => id !== item.id);
      render();
    };
    list.appendChild(row);
  });
}

/* ============== Selection ============== */
function updateSelectionUI() {
  const n = state.selection.length;
  if ($('#sel-style-count')) $('#sel-style-count').textContent = n;
  if ($('#sel-all')) $('#sel-all').disabled = state.menu.items.length === 0;
  if ($('#sel-clear')) $('#sel-clear').disabled = n === 0;
  const sec = $('#sel-style-section');
  if (sec) sec.style.display = n > 0 ? 'block' : 'none';
  // 单个玩法选中时显示「数量」输入框
  const countRow = $('#count-edit-row');
  if (countRow) {
    if (n === 1) {
      const item = state.menu.items.find(it => it.id === state.selection[0]);
      if (item) {
        countRow.style.display = 'flex';
        $('#item-count').value = item.count;
      } else {
        countRow.style.display = 'none';
      }
    } else {
      countRow.style.display = 'none';
    }
  }
  if (n > 0) updateSelStylePanel();
}

function updateSelStylePanel() {
  const items = state.menu.items.filter(it => state.selection.includes(it.id));
  if (items.length === 0) return;
  $('#sel-style-count').textContent = items.length;
  const first = getEffectiveStyle(items[0]);
  $('#sel-font-size').value = first.fontSize;
  $('#sel-font-weight').value = first.fontWeight;
  $('#sel-stroke-color').value = first.strokeColor;
  $('#sel-stroke-width').value = first.strokeWidth;
  $('#sel-shadow-x').value = first.shadowX;
  $('#sel-shadow-y').value = first.shadowY;
  $('#sel-shadow-blur').value = first.shadowBlur;
  $('#sel-shadow-color').value = first.shadowColor;
  $('#sel-text-color').value = first.textColor;
  $('#sel-letter-spacing').value = first.letterSpacing;
  $('#sel-row-gap').value = state.style.rowGap;  // 全局 rowGap（不是 per-item）
  $('#sel-col-width').value = first.colWidth;
  $('#sel-row-height').value = first.rowHeight;
  $('#sel-show-bg').checked = first.bgOn;
  $('#sel-bg-color').value = first.bgColor;
  $('#sel-bg-radius').value = first.bgRadius;
  $('#sel-bg-opacity').value = Math.round(first.bgOpacity * 100);
}

function applySelStyle(mutator) {
  state.menu.items.forEach(item => {
    if (!state.selection.includes(item.id)) return;
    if (!item.style) item.style = {};
    mutator(item.style);
  });
  render();
}

function alignSelection(direction) {
  const selected = state.menu.items.filter(it => state.selection.includes(it.id));
  if (selected.length < 2) return;
  const positions = selected.map(it => {
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    return { item: it, x: pos.x, y: pos.y, w: st.colWidth, h: st.rowHeight };
  });
  let target;
  if (direction === 'left') {
    target = Math.min(...positions.map(p => p.x));
    positions.forEach(p => { p.item.x = target; });
  } else if (direction === 'right') {
    target = Math.max(...positions.map(p => p.x + p.w));
    positions.forEach(p => { p.item.x = target - p.w; });
  } else if (direction === 'top') {
    target = Math.min(...positions.map(p => p.y));
    positions.forEach(p => { p.item.y = target; });
  } else if (direction === 'bottom') {
    target = Math.max(...positions.map(p => p.y + p.h));
    positions.forEach(p => { p.item.y = target - p.h; });
  }
  render();
  saveState();
}

/* ============== Drag / Pan / Zoom ============== */
let spaceDown = false;

function setupInteraction() {
  const viewport = $('#canvas-viewport');
  const wrap = $('#canvas-wrap');

  // Space key for pan
  window.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    if (e.code === 'Space') {
      spaceDown = true;
      document.body.classList.add('pan-ready');
      e.preventDefault();
    }
    // Backspace / Delete 删除选中的对象（玩法 / 文字 / 图片）
    if ((e.key === 'Backspace' || e.key === 'Delete') && state.imageSelection) {
      e.preventDefault();
      state.imageItems = state.imageItems.filter(it => it.id !== state.imageSelection);
      state.imageSelection = null;
      render();
    } else if ((e.key === 'Backspace' || e.key === 'Delete') && state.textSelection) {
      e.preventDefault();
      state.textItems = state.textItems.filter(it => it.id !== state.textSelection);
      state.textSelection = null;
      syncTextInputsFromSelection();
      render();
    } else if ((e.key === 'Backspace' || e.key === 'Delete') && state.selection && state.selection.length) {
      e.preventDefault();
      state.menu.items = state.menu.items.filter(it => !state.selection.includes(it.id));
      state.selection = [];
      render();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      spaceDown = false;
      document.body.classList.remove('pan-ready');
      document.body.classList.remove('panning');
    }
  });

  // Pan: space+drag or middle mouse
  let panning = false, panStart = { x: 0, y: 0, px: 0, py: 0 };
  viewport.addEventListener('mousedown', e => {
    if (spaceDown || e.button === 1) {
      panning = true;
      panStart = { x: e.clientX, y: e.clientY, px: state.panX, py: state.panY };
      document.body.classList.add('panning');
      e.preventDefault();
      return;
    }
    if (e.target.closest('.menu-item')) return; // 点击玩法项不触发框选
    if (e.target.closest('.image-item')) return; // 点击图片不触发框选
    if (e.target.closest('.text-item')) return; // 点击文字不触发框选
    // 空白点击：清除图片选中
    if (state.imageSelection) { state.imageSelection = null; renderImageItems(); }
    startMarquee(e);
  });
  window.addEventListener('mousemove', e => {
    if (panning) {
      state.panX = panStart.px + (e.clientX - panStart.x);
      state.panY = panStart.py + (e.clientY - panStart.y);
      applyTransform();
    }
  });
  window.addEventListener('mouseup', () => {
    if (panning) {
      panning = false;
      document.body.classList.remove('panning');
      saveState();
    }
  });

  // Zoom: Alt+wheel
  wrap.addEventListener('wheel', e => {
    if (document.body.classList.contains('source-mode')) return;
    if (!e.altKey && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const newZoom = Math.max(0.05, Math.min(6, state.zoom * factor));
    if (newZoom === state.zoom) return;
    // 以鼠标位置为中心缩放
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    state.panX = mx - (mx - state.panX) * (newZoom / state.zoom);
    state.panY = my - (my - state.panY) * (newZoom / state.zoom);
    state.zoom = newZoom;
    applyTransform();
    saveState();
  }, { passive: false });

  // Zoom buttons
  $('#zoom-in').onclick = () => {
    state.zoom = Math.min(6, state.zoom * 1.2);
    applyTransform(); saveState();
  };
  $('#zoom-out').onclick = () => {
    state.zoom = Math.max(0.05, state.zoom / 1.2);
    applyTransform(); saveState();
  };
  $('#zoom-fit').onclick = fitToWindow;

  // Drag menu items
  setupItemDrag();
  // Marquee selection
  setupMarquee();
}

function setupItemDrag() {
  let dragging = false, dragStart = null, dragIds = [];

  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (spaceDown) return;
    const el = e.target.closest('.menu-item');
    if (!el) return;
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const id = el.dataset.id;
    let ids = state.selection.slice();
    if (e.shiftKey) {
      if (ids.includes(id)) ids = ids.filter(x => x !== id);
      else ids.push(id);
    } else if (!ids.includes(id)) {
      ids = [id];
    }
    state.selection = ids;
    dragging = true;
    const items = state.menu.items.filter(it => ids.includes(it.id));
    dragStart = {
      x: e.clientX, y: e.clientY,
      items: items.map(it => {
        const p = getItemPos(it);  // 用实际渲染位置，避免 null → 0 导致全部重叠
        return { id: it.id, x: p.x, y: p.y };
      })
    };
    dragIds = ids;
    document.body.classList.add('panning');
    // 只更新选中态，不重建 DOM（否则 dblclick 永远不触发）
    document.querySelectorAll('.menu-item').forEach(el2 => {
      el2.classList.toggle('selected', ids.includes(el2.dataset.id));
    });
    updateSelectionUI();
  }, true);  // ← capture 阶段，确保最先执行

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const scale = state.zoom;
    const dx = (e.clientX - dragStart.x) / scale;
    const dy = (e.clientY - dragStart.y) / scale;
    dragStart.items.forEach(d => {
      const item = state.menu.items.find(it => it.id === d.id);
      if (item) {
        item.x = d.x + dx;
        item.y = d.y + dy;
      }
    });
    renderMenuItems();
  });

  window.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      document.body.classList.remove('panning');
      hideSnapGuides();
      saveState();
    }
  });
}

function applySnapGuides(dragIds) {
  const SNAP = 6; // px threshold
  const vGuide = $('#guide-v');
  const hGuide = $('#guide-h');
  vGuide.style.display = 'none';
  hGuide.style.display = 'none';

  const dragged = state.menu.items.filter(it => dragIds.includes(it.id));
  if (!dragged.length) return;

  // collect snap targets (canvas edges + other items)
  const cw = state.canvas.width;
  const ch = state.canvas.height;
  const vTargets = [0, cw / 2, cw];
  const hTargets = [0, ch / 2, ch];
  state.menu.items.forEach(it => {
    if (dragIds.includes(it.id)) return;
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    vTargets.push(pos.x, pos.x + st.colWidth / 2, pos.x + st.colWidth);
    hTargets.push(pos.y, pos.y + st.rowHeight / 2, pos.y + st.rowHeight);
  });

  let bestV = null, bestVDelta = SNAP + 1;
  let bestH = null, bestHDelta = SNAP + 1;

  dragged.forEach(it => {
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    const myV = [pos.x, pos.x + st.colWidth / 2, pos.x + st.colWidth];
    const myH = [pos.y, pos.y + st.rowHeight / 2, pos.y + st.rowHeight];
    myV.forEach(v => {
      vTargets.forEach(t => {
        const delta = Math.abs(v - t);
        if (delta < bestVDelta) {
          bestVDelta = delta;
          bestV = { from: v, to: t };
        }
      });
    });
    myH.forEach(h => {
      hTargets.forEach(t => {
        const delta = Math.abs(h - t);
        if (delta < bestHDelta) {
          bestHDelta = delta;
          bestH = { from: h, to: t };
        }
      });
    });
  });

  // apply snap: shift each dragged item by (to - from)
  if (bestV && bestVDelta <= SNAP) {
    const shift = bestV.to - bestV.from;
    dragged.forEach(it => { it.x += shift; });
    vGuide.style.display = 'block';
    vGuide.style.left = bestV.to + 'px';
    vGuide.style.top = '0';
    vGuide.style.height = ch + 'px';
  }
  if (bestH && bestHDelta <= SNAP) {
    const shift = bestH.to - bestH.from;
    dragged.forEach(it => { it.y += shift; });
    hGuide.style.display = 'block';
    hGuide.style.top = bestH.to + 'px';
    hGuide.style.left = '0';
    hGuide.style.width = cw + 'px';
  }
}

function hideSnapGuides() {
  $('#guide-v').style.display = 'none';
  $('#guide-h').style.display = 'none';
}

function setupMarquee() {
  const stage = $('#stage');
  const marquee = $('#marquee');
  let mousing = false, startPt = null;

  stage.addEventListener('mousedown', e => {
    if (spaceDown) return;
    if (e.target.closest('.menu-item')) return;
    if (e.target.closest('.text-item')) return;
    if (e.button !== 0) return;
    mousing = true;
    const rect = stage.getBoundingClientRect();
    startPt = {
      x: (e.clientX - rect.left) / state.zoom,
      y: (e.clientY - rect.top) / state.zoom
    };
    if (!e.shiftKey) state.selection = [];
    marquee.style.display = 'block';
    marquee.style.left = startPt.x + 'px';
    marquee.style.top = startPt.y + 'px';
    marquee.style.width = '0px';
    marquee.style.height = '0px';
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!mousing) return;
    const rect = stage.getBoundingClientRect();
    const cur = {
      x: (e.clientX - rect.left) / state.zoom,
      y: (e.clientY - rect.top) / state.zoom
    };
    const x = Math.min(startPt.x, cur.x);
    const y = Math.min(startPt.y, cur.y);
    const w = Math.abs(cur.x - startPt.x);
    const h = Math.abs(cur.y - startPt.y);
    marquee.style.left = x + 'px';
    marquee.style.top = y + 'px';
    marquee.style.width = w + 'px';
    marquee.style.height = h + 'px';

    // hit test
    const sel = [];
    state.menu.items.forEach(item => {
      const ix = item.x != null ? item.x : 0;
      const iy = item.y != null ? item.y : 0;
      const st = getEffectiveStyle(item);
      const iw = st.colWidth;
      const ih = st.rowHeight;
      if (ix < x + w && ix + iw > x && iy < y + h && iy + ih > y) {
        sel.push(item.id);
      }
    });
    state.selection = sel;
    renderMenuItems();
    updateSelectionUI();
  });

  window.addEventListener('mouseup', () => {
    if (mousing) {
      mousing = false;
      marquee.style.display = 'none';
      saveState();
    }
  });
}

/* ============== Icon Picker ============== */
let pickerTargetId = null;

async function loadGifts() {
  try {
    const res = await fetch('gifts.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.gifts = Array.isArray(data) ? data : (data.gifts || []);
  } catch (e) {
    state.gifts = [];
  }
}

// 图标 URL ↔ giftId 压缩：URL 里存 g<giftId>（6字符）而非完整 URL（90字符）
function urlToGiftId(url) {
  if (!url) return '';
  const gift = state.gifts.find(g => g.webp === url);
  return gift ? 'g' + gift.giftId : url;
}

function giftIdToUrl(id) {
  if (!id || !id.startsWith('g')) return id || '';
  const giftId = parseInt(id.slice(1));
  const gift = state.gifts.find(g => g.giftId === giftId);
  return gift ? (gift.webp || '') : '';
}

function openPicker(itemId) {
  pickerTargetId = itemId;
  $('#picker-modal').classList.add('open');
  renderPickerGrid('');
}

function renderPickerGrid(search) {
  const grid = $('#picker-grid');
  grid.innerHTML = '';
  const gifts = state.gifts.filter(g => !search || g.name.includes(search));
  gifts.forEach(gift => {
    const cell = document.createElement('div');
    cell.className = 'icon-cell';
    cell.innerHTML = `
      <div class="img-wrap"><img src="${gift.webp || gift.url || ''}" alt="" crossorigin="anonymous" referrerpolicy="no-referrer"></div>
      <div class="nm">${gift.name}</div>
    `;
    cell.onclick = () => {
      $('#picker-modal').classList.remove('open');
      const item = state.menu.items.find(it => it.id === pickerTargetId);
      if (item) {
        item.iconUrl = gift.webp || gift.url || '';
        item.iconType = 'lib';
        render();
      }
    };
    grid.appendChild(cell);
  });
}

/* ============== Controls ============== */
function setupControls() {
  // Mode
  $('#mode-select').value = state.mode;
  $('#mode-select').onchange = (e) => {
    state.mode = e.target.value;
    state.selection = [];
    applyMode();
    fitToWindow();
    saveState();
  };

  // Add / Clear
  $('#add-item').onclick = () => {
    const item = {
      id: uid(), name: '新玩法', count: 1,
      iconUrl: '', iconType: 'none', side: 'left',
      x: null, y: null, style: null
    };
    state.menu.items.push(item);
    render();
  };
  $('#clear-items').onclick = () => {
    if (state.menu.items.length === 0) return;
    if (confirm('确定清空所有玩法项？')) {
      state.menu.items = [];
      state.selection = [];
      render();
    }
  };

  $('#clear-all').onclick = () => {
    const has = state.menu.items.length || state.textItems.length || state.imageItems.length;
    if (!has) return;
    if (confirm('确定清空画布上的全部玩法、文字、图片？此操作不可撤销。')) {
      state.menu.items = [];
      state.selection = [];
      state.textItems = [];
      state.textSelection = null;
      state.imageItems = [];
      state.imageSelection = null;
      render();
    }
  };

  // Text items
  const DEFAULT_TEXT = 'IOS用户请到哔哩哔哩直播公众号充值哦~';
  $('#add-text').onclick = () => {
    const t = {
      id: uid(),
      text: DEFAULT_TEXT,
      x: 100, y: 100,
      w: 400,
      fontSize: parseInt($('#text-font-size').value) || 32,
      color: $('#text-color').value,
      strokeWidth: parseInt($('#text-stroke-width').value) || 2,
      strokeColor: $('#text-stroke-color') ? $('#text-stroke-color').value : '#000000',
      fontFamily: ($('#text-font-local').value || $('#text-font-family').value || '').trim(),
      fontWeight: '700',
      letterSpacing: $('#text-letter-spacing') ? (parseFloat($('#text-letter-spacing').value) || 0) : 0
    };
    state.textItems.push(t);
    state.textSelection = t.id;
    syncTextInputsFromSelection();
    render();
  };

  // 字号/字色/描边/字体 改变时自动应用到选中文字
  const bindText = (id, key, transform) => {
    const el = $('#' + id);
    if (!el) return;
    el.oninput = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') v = parseFloat(v) || 0;
      if (transform) v = transform(v);
      const id = state.textSelection;
      const t = state.textItems.find(it => it.id === id);
      if (t) {
        t[key] = v;
        render();
      }
    };
  };
  bindText('text-font-size', 'fontSize');
  bindText('text-letter-spacing', 'letterSpacing');
  bindText('text-color', 'color');
  bindText('text-stroke-width', 'strokeWidth');
  bindText('text-stroke-color', 'strokeColor');

  // 字体下拉变化时，写入 fontFamily；如果用户改了 select 则清空本地字体输入
  const fontSel = $('#text-font-family');
  if (fontSel) {
    fontSel.oninput = () => {
      const id = state.textSelection;
      const t = state.textItems.find(it => it.id === id);
      if (t) {
        t.fontFamily = fontSel.value;
        if ($('#text-font-local')) $('#text-font-local').value = '';
        render();
      }
    };
  }

  // 本地字体输入框：写到 fontFamily
  const fontLocalEl = $('#text-font-local');
  if (fontLocalEl) {
    fontLocalEl.oninput = () => {
      const id = state.textSelection;
      const t = state.textItems.find(it => it.id === id);
      if (t) {
        t.fontFamily = fontLocalEl.value.trim() || $('#text-font-family').value;
        render();
      }
    };
  }

  // Stage click clears text selection
  $('#stage').addEventListener('mousedown', (e) => {
    if (e.target.closest('.text-item')) return;
    if (state.textSelection) {
      state.textSelection = null;
      renderTextItems();
    }
  }, true);

  // Selection style inputs
  const bindSel = (id, key, transform) => {
    const el = $('#' + id);
    el.oninput = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') v = parseFloat(v) || 0;
      if (transform) v = transform(v);
      applySelStyle(st => { st[key] = v; });
    };
  };
  bindSel('sel-font-size', 'fontSize');
  bindSel('sel-font-weight', 'fontWeight');
  bindSel('sel-stroke-color', 'strokeColor');
  bindSel('sel-stroke-width', 'strokeWidth');
  bindSel('sel-shadow-x', 'shadowX');
  bindSel('sel-shadow-y', 'shadowY');
  bindSel('sel-shadow-blur', 'shadowBlur');
  bindSel('sel-shadow-color', 'shadowColor');
  bindSel('sel-text-color', 'textColor');
  bindSel('sel-letter-spacing', 'letterSpacing');
  // rowGap 改全局：所有 item 的 y 置 null 让 autoPosition 用新 rowGap 实时重算
  $('#sel-row-gap').oninput = () => {
    const v = parseInt($('#sel-row-gap').value) || 0;
    state.style.rowGap = v;
    // 清空所有 item 的 per-item rowGap 覆盖，避免历史 per-item 值干扰新全局值
    state.menu.items.forEach(it => {
      it.y = null;
      if (it.style && 'rowGap' in it.style) delete it.style.rowGap;
    });
    render();
    saveState();
  };
  // 列宽：右侧玩法的图标固定在右端，左边拉长；左侧玩法左边固定，右边拉长
  $('#sel-col-width').oninput = () => {
    const v = parseInt($('#sel-col-width').value) || 200;
    state.menu.items.forEach(item => {
      if (!state.selection.includes(item.id)) return;
      if (!item.style) item.style = {};
      const oldW = item.style.colWidth != null ? item.style.colWidth : state.style.colWidth;
      item.style.colWidth = v;
      // 右侧玩法：右端（图标端）位置固定，x 跟着 colWidth 反向调整
      if ((item.side || 'left') === 'right' && item.x != null) {
        const rightEdge = item.x + oldW;
        item.x = rightEdge - v;
      }
    });
    render();
    saveState();
  };
  bindSel('sel-row-height', 'rowHeight', v => parseInt(v) || 60);
  bindSel('sel-show-bg', 'bgOn');
  bindSel('sel-bg-color', 'bgColor');
  bindSel('sel-bg-radius', 'bgRadius');
  bindSel('sel-bg-opacity', 'bgOpacity', v => v / 100);

  // Align buttons (manual)
  $('#sel-align-left').onclick = () => alignSelection('left');
  $('#sel-align-right').onclick = () => alignSelection('right');
  $('#sel-align-top').onclick = () => alignSelection('top');
  $('#sel-align-bottom').onclick = () => alignSelection('bottom');

  // Font family select
  $('#sel-font-family').onchange = (e) => {
    if (e.target.value === 'custom-font') {
      $('#sel-font-file').click();
    } else {
      applySelStyle(st => { st.fontFamily = e.target.value; });
    }
  };
  $('#sel-font-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const face = new FontFace('CustomFont', ev.target.result);
      face.load().then(() => {
        document.fonts.add(face);
        state.customFontFace = face;
        state.customFontFileName = file.name;
        applySelStyle(st => { st.fontFamily = 'CustomFont'; });
      }).catch(() => alert('字体加载失败'));
    };
    reader.readAsArrayBuffer(file);
  };

  // Layout
  $('#reset-layout').onclick = () => {
    state.menu.items.forEach(it => { it.x = null; it.y = null; });
    render();
  };

  // Numbers
  $('#show-numbers').checked = state.style.showNumbers;
  $('#show-numbers').onchange = (e) => { state.style.showNumbers = e.target.checked; render(); };
  $('#item-count').oninput = (e) => {
    if (state.selection.length !== 1) return;
    const item = state.menu.items.find(it => it.id === state.selection[0]);
    if (!item) return;
    item.count = Math.max(0, parseInt(e.target.value) || 0);
    render();
  };

  // Icon
  $('#icon-size').value = state.style.iconSize;
  $('#icon-size').oninput = (e) => { state.style.iconSize = parseInt(e.target.value) || 44; render(); };
  $('#icon-gap').value = state.style.iconGap;
  $('#icon-gap').oninput = (e) => { state.style.iconGap = parseInt(e.target.value) || 10; render(); };

  // Safe area
  $('#show-safe').onclick = () => {
    state.showSafe = !state.showSafe;
    applyMode();
  };

  // iPhone overlay
  $('#open-overlay').onchange = (e) => {
    state.phoneOverlay = e.target.value;
    applyPhoneOverlay();
  };

  function applyPhoneOverlay() {
    const off = state.phoneOverlay === 'off' || !state.phoneOverlay;
    document.body.classList.toggle('phone-overlay-on', !off);
    $('#safe-rect-iphone').style.display = state.phoneOverlay === 'iphone' ? 'block' : 'none';
    $('#safe-rect-android').style.display = state.phoneOverlay === 'android' ? 'block' : 'none';
  }

  // Copy source link
  $('#copy-source').onclick = () => {
    updateHash();
    const dataHash = state.lastCopiedHash || (location.hash || '').slice(1);
    // 关键：直播姬用的 CEF 浏览器对 URL # 后的 fragment 处理不可靠，
    // 必须把数据放在 query 参数里，CEF 才会传给前端页面。
    // 格式：?s&d=<data>（s=source 标记，d=数据）。URL 总长 ~200 字符。
    const url = location.origin + location.pathname + '?s&d=' + dataHash;
    const btn = $('#copy-source');
    const orig = btn.textContent;

    const showCopied = () => {
      btn.textContent = '✓ 已复制';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    };

    // 优先用现代 clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(showCopied).catch(() => {
        // 兜底：用 textarea + execCommand
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showCopied(); }
        catch (e) {
          // 最终兜底：prompt 让用户手动复制
          window.prompt('请手动复制链接：', url);
          btn.textContent = orig;
        }
        document.body.removeChild(ta);
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showCopied(); }
      catch (e) { window.prompt('请手动复制链接：', url); btn.textContent = orig; }
      document.body.removeChild(ta);
    }
  };

  // Export PNG
  $('#export-png').onclick = exportPNG;

  // Picker
  $('#picker-close').onclick = () => $('#picker-modal').classList.remove('open');
  $('#picker-modal').onclick = (e) => { if (e.target === $('#picker-modal')) $('#picker-modal').classList.remove('open'); };
  $('#picker-search').oninput = (e) => renderPickerGrid(e.target.value);
  $('#picker-upload').onchange = (e) => {
    const file = e.target.files[0];
    if (!file || !pickerTargetId) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const item = state.menu.items.find(it => it.id === pickerTargetId);
      if (item) {
        item.iconUrl = ev.target.result;
        item.iconType = 'upload';
        render();
      }
      $('#picker-modal').classList.remove('open');
    };
    reader.readAsDataURL(file);
  };

  // Resize
  window.addEventListener('resize', debounce(() => {
    if (document.body.classList.contains('source-mode')) {
      applyTransform();
    }
  }, 100));

  // === 图片板块 ===
  // 上传按钮
  $('#upload-image-btn').onclick = () => $('#upload-image-input').click();
  $('#upload-image-input').onchange = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.imageLibrary.push({ name: file.name, url: ev.target.result, isUpload: true });
        renderImageLibrary();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };
  // 清空画布上所有图片
  $('#clear-images-btn').onclick = () => {
    if (state.imageItems.length === 0) return;
    if (confirm('确定清空画布上的所有图片？')) {
      state.imageItems = [];
      state.imageSelection = null;
      renderImageItems();
      saveState();
    }
  };
  // 解锁所有图片
  $('#unlock-all-btn').onclick = () => {
    const locked = state.imageItems.filter(it => it.locked);
    if (locked.length === 0) return;
    locked.forEach(it => { it.locked = false; });
    renderImageItems();
    saveState();
  };
  renderImageLibrary();

  // 右键菜单关闭：任何点击/滚轮/键盘都关闭
  const closeCtx = () => {
    const m = document.querySelector('.ctx-menu');
    if (m) m.remove();
  };
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.ctx-menu')) closeCtx();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCtx(); });
  window.addEventListener('blur', closeCtx);
  window.addEventListener('resize', closeCtx);
}

/* ============== Export PNG ============== */
async function exportPNG() {
  const btn = $('#export-png');
  const orig = btn.textContent;
  btn.textContent = '导出中...';
  btn.disabled = true;
  try {
    const stage = $('#stage');
    const stageFrame = $('#stage-frame');
    const coverMask = $('#cover-mask');
    const oldTransform = $('#stage-scaler').style.transform;
    const oldStageBg = stage.style.background;
    const oldStageBgImg = stage.style.backgroundImage;
    const oldStageBorder = stage.style.border;
    const oldStageShadow = stage.style.boxShadow;
    const oldFrameDisplay = stageFrame.style.display;
    const oldCoverMaskDisplay = coverMask ? coverMask.style.display : '';
    const oldSafeAreaDisplay = $('#safe-area').style.display;
    $('#stage-scaler').style.transform = 'none';
    stage.style.background = 'transparent';
    stage.style.backgroundImage = 'none';
    stage.style.border = 'none';
    stage.style.boxShadow = 'none';
    stageFrame.style.display = 'none';
    // 横板安全线占位块（编辑器视觉提示）一并隐藏，导出图不留黑块
    if (coverMask) coverMask.style.display = 'none';
    // 竖板安全线矩形也隐藏
    $('#safe-area').style.display = 'none';
    await new Promise(r => setTimeout(r, 100));

    // 等所有图标加载完（跨域 webp 需要时间），最多等 3 秒
    const imgs = Array.from(stage.querySelectorAll('img'));
    await Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', finish, { once: true });
        setTimeout(finish, 3000); // 超时兜底
      });
    }));

    const canvas = await html2canvas(stage, {
      backgroundColor: null,
      scale: 1,
      useCORS: true,
      allowTaint: false,
      logging: false
    });
    $('#stage-scaler').style.transform = oldTransform;
    stage.style.background = oldStageBg;
    stage.style.backgroundImage = oldStageBgImg;
    stage.style.border = oldStageBorder;
    stage.style.boxShadow = oldStageShadow;
    stageFrame.style.display = oldFrameDisplay;
    if (coverMask) coverMask.style.display = oldCoverMaskDisplay;
    $('#safe-area').style.display = oldSafeAreaDisplay;
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bilibili-menu-${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch (e) {
    alert('导出失败: ' + e.message);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

/* ============== iPhone overlay clock ============== */
function updateOverlayClock() {
  const el = $('#ovl-time');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

/* ============== Init ============== */
async function init() {
  const params = new URLSearchParams(location.search);
  const isSource = params.has('s') || params.get('source') === '1';

  // 关键：先加载礼物库再 applyLoadedData。
  // URL 里图标是 g<giftId> 压缩形式，applyLoadedData 需要 state.gifts 才能还原为 webp URL。
  // 否则 source mode 下图标会全部丢失。
  await loadGifts();

  // 数据加载优先级：?d=（query 参数，CEF 友好）> hash > localStorage
  let loaded = false;
  const fromQuery = params.get('d');
  if (fromQuery) {
    try { applyLoadedData(decodeState(fromQuery)); loaded = true; } catch (e) {}
  }
  if (!loaded) {
    const fromHash = loadFromHash();
    if (fromHash) loaded = true;
  }
  if (!loaded) loadState();

  // Source mode：兼容 ?s（新）和 ?source=1（旧）
  if (isSource) {
    document.body.classList.add('source-mode');
    $('#status-mode').textContent = '浏览器源';
  }

  setupControls();
  setupInteraction();
  setupTextItemDrag();
  setupImageItemDrag();
  applyMode();
  render();

  // Source mode 兜底：用 setProperty + !important 把所有可能的容器强制透明。
  // 直播姬 CEF 对 CSS 选择器经常失效，必须内联样式强写并多帧兜底。
  if (isSource) {
    const html = document.documentElement;
    html.classList.add('is-source');
    const forceTransparent = () => {
      // 包含 <html> 元素 - CSS 选择器无法从 body 反向选 html，这是关键
      const sels = ['html', 'body', '#app', '#main', '#canvas-wrap', '#canvas-viewport', '#stage-scaler', '#stage', '#cover-mask'];
      sels.forEach(sel => {
        const el = sel === 'html' ? document.documentElement : $(sel);
        if (!el) return;
        el.style.setProperty('background', 'transparent', 'important');
        el.style.setProperty('background-color', 'transparent', 'important');
        el.style.setProperty('background-image', 'none', 'important');
      });
      const stage = $('#stage');
      if (stage) {
        stage.style.setProperty('border', 'none', 'important');
        stage.style.setProperty('box-shadow', 'none', 'important');
      }
      const frame = $('#stage-frame');
      if (frame) frame.style.setProperty('display', 'none', 'important');
    };
    forceTransparent();
    // 多帧后再次执行，避免被异步 CSS / 重排重置
    [50, 200, 500, 1500].forEach(ms => setTimeout(forceTransparent, ms));

    // MutationObserver 兜底：watch stage 的 style/class 变化，发现背景被重置就立刻清掉
    const stageEl = $('#stage');
    if (stageEl && window.MutationObserver) {
      const mo = new MutationObserver(() => {
        const bg = stageEl.style.background || stageEl.style.backgroundColor;
        if (bg && bg !== 'transparent' && !bg.includes('transparent')) {
          forceTransparent();
        }
      });
      mo.observe(stageEl, { attributes: true, attributeFilter: ['style', 'class'] });
    }
  }

  // Auto-fill default gifts only when the menu is completely empty AND
  // the user has not added any preset items that they want to keep.
  const isUntouchedDefault = state.menu.items.length === 0;
  if (isUntouchedDefault && state.gifts.length > 0) {
    for (let i = 0; i < Math.min(6, state.gifts.length); i++) {
      const g = state.gifts[i];
      state.menu.items.push({
        id: uid(), name: g.name || '礼物', count: 1,
        iconUrl: g.webp || g.url || '', iconType: 'lib',
        side: i < 3 ? 'left' : 'right', x: null, y: null, style: null
      });
    }
    render();
  }

  // Overlay clock
  updateOverlayClock();
  setInterval(updateOverlayClock, 30000);

  // Phone overlay
  if (state.phoneOverlay && state.phoneOverlay !== 'off') {
    $('#open-overlay').value = state.phoneOverlay;
    document.body.classList.add('phone-overlay-on');
    $('#safe-rect-' + state.phoneOverlay).style.display = 'block';
  }

  // Fit on first load
  if (!document.body.classList.contains('source-mode')) {
    setTimeout(fitToWindow, 100);
  } else {
    // source mode: 重新 applyTransform 确保 wrap 尺寸已就绪
    setTimeout(applyTransform, 50);
    setTimeout(applyTransform, 300);
  }
}

init();
</script>
