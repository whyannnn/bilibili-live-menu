    cell.innerHTML = `<img src="${entry.url}" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.style.opacity=0.3"><div class="lib-name">${(entry.name || '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))}</div>`;
    if (entry.isUpload) {
      const del = document.createElement('button');
      del.className = 'lib-del';
      del.textContent = '×';
      del.title = '从库中移除';
      del.onclick = (e) => {
        e.stopPropagation();
        state.imageLibrary.splice(idx, 1);
        renderImageLibrary();
      };
      cell.appendChild(del);
    }
    cell.onclick = () => addImageToCanvas(entry);
    lib.appendChild(cell);
  });
}

function addImageToCanvas(entry) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.referrerPolicy = 'no-referrer';
  img.onload = () => {
    // 按画布短边一半作为默认尺寸
    const maxSide = Math.min(state.canvas.width, state.canvas.height) * 0.4;
    const ratio = img.naturalWidth / img.naturalHeight;
    let w, h;
    if (ratio >= 1) { w = Math.min(maxSide, img.naturalWidth); h = w / ratio; }
    else { h = Math.min(maxSide, img.naturalHeight); w = h * ratio; }
    const item = {
      id: uid(),
      url: entry.url,
      name: entry.name,
      x: Math.round((state.canvas.width - w) / 2),
      y: Math.round((state.canvas.height - h) / 2),
      w: Math.round(w),
      h: Math.round(h),
      z: state.imageItems.length // 新加的放最上层
    };
    state.imageItems.push(item);
    state.imageSelection = item.id;
    renderImageItems();
    saveState();
  };
  img.onerror = () => {
    // 即使加载失败也加入（保留 url）
    const item = {
      id: uid(),
      url: entry.url,
      name: entry.name,
      x: Math.round(state.canvas.width * 0.3),
      y: Math.round(state.canvas.height * 0.3),
      w: 200, h: 100, z: state.imageItems.length
    };
    state.imageItems.push(item);
    state.imageSelection = item.id;
    renderImageItems();
    saveState();
  };
  img.src = entry.url;
}

function renderImageItems() {
  const fg = $('#image-items');
  const bg = $('#image-bg');
  if (!fg || !bg) return;
  fg.innerHTML = '';
  bg.innerHTML = '';
  // z<0 的图片渲染到 #image-bg（z-index: 0，置底）
  // z>=0 的图片渲染到 #image-items（z-index: 3，置顶/中间）
  const fgList = state.imageItems.filter(im => (im.z || 0) >= 0);
  const bgList = state.imageItems.filter(im => (im.z || 0) < 0);
  fgList.forEach(it => renderOneImage(it, fg, false));
  bgList.forEach(it => renderOneImage(it, bg, true));
}

function renderOneImage(it, container, isBottom) {
  const el = document.createElement('div');
  el.className = 'image-item';
  el.dataset.id = it.id;
  if (state.imageSelection === it.id) el.classList.add('selected');
  if (it.locked) el.classList.add('locked');
  el.style.left = it.x + 'px';
  el.style.top = it.y + 'px';
  el.style.width = it.w + 'px';
  el.style.height = it.h + 'px';
  el.style.zIndex = Math.max(1, (it.z || 0)) + 10; // 容器内相对层级
  el.title = it.name || '图片';
  el.innerHTML = `<img src="${it.url}" crossorigin="anonymous" referrerpolicy="no-referrer" draggable="false">` +
    '<span class="lock-badge">🔓 解锁</span>' +
    '<button class="del-btn" title="删除">×</button>' +
    '<div class="resize-handle rh-tl" data-corner="tl"></div>' +
    '<div class="resize-handle rh-tr" data-corner="tr"></div>' +
    '<div class="resize-handle rh-bl" data-corner="bl"></div>' +
    '<div class="resize-handle rh-br" data-corner="br"></div>' +
    '<div class="resize-handle rh-t" data-corner="t"></div>' +
    '<div class="resize-handle rh-b" data-corner="b"></div>' +
    '<div class="resize-handle rh-l" data-corner="l"></div>' +
    '<div class="resize-handle rh-r" data-corner="r"></div>';
  el.querySelector('.del-btn').onclick = (e) => {
    e.stopPropagation();
    state.imageItems = state.imageItems.filter(x => x.id !== it.id);
    if (state.imageSelection === it.id) state.imageSelection = null;
    renderImageItems();
    saveState();
  };
  el.querySelector('.lock-badge').onclick = (e) => {
    e.stopPropagation();
    e.preventDefault();
    it.locked = false;
    renderImageItems();
    saveState();
  };
  el.querySelector('.lock-badge').title = '点击解锁';
  el.onclick = (e) => {
    if (it.locked) return;
    e.stopPropagation();
    state.imageSelection = it.id;
    // 不重建 DOM，手动 toggle selected（避免 renderImageItems 每次点击全量重建导致拖动失灵）
    document.querySelectorAll('.image-item').forEach(el2 => el2.classList.remove('selected'));
    el.classList.add('selected');
  };
  el.oncontextmenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    state.imageSelection = it.id;
    renderImageItems();
    showCtxMenu(e.clientX, e.clientY, [
      { label: it.locked ? '🔓 解锁（可拖动）' : '🔒 锁定（不可拖动）', act: () => { it.locked = !it.locked; renderImageItems(); saveState(); } },
      { sep: true },
      { label: '置顶', act: () => adjustImageZ(it.id, 'top') },
      { label: '置底', act: () => adjustImageZ(it.id, 'bottom') },
      { sep: true },
      { label: '上移一层', act: () => adjustImageZ(it.id, 'up') },
      { label: '下移一层', act: () => adjustImageZ(it.id, 'down') },
      { sep: true },
      { label: '删除', act: () => { state.imageItems = state.imageItems.filter(x => x.id !== it.id); state.imageSelection = null; renderImageItems(); saveState(); } }
    ]);
  };
  // 4 角拉伸手柄
  el.querySelectorAll('.resize-handle').forEach(h => {
    h.onmousedown = (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (it.locked) return;
      const corner = h.dataset.corner;
      const startX = e.clientX, startY = e.clientY;
      const startW = it.w, startH = it.h, startLX = it.x, startTY = it.y;
      const scale = state.zoom;
      const ratio = startW / startH;
      const onMove = (ev) => {
        let dx = (ev.clientX - startX) / scale;
        let dy = (ev.clientY - startY) / scale;
        let newW = startW, newH = startH, newX = startLX, newY = startTY;
        if (corner === 'br') { newW = startW + dx; newH = startH + dy; }
        else if (corner === 'tr') { newW = startW + dx; newH = startH - dy; newY = startTY + dy; }
        else if (corner === 'bl') { newW = startW - dx; newH = startH + dy; newX = startLX + dx; }
        else if (corner === 'tl') { newW = startW - dx; newH = startH - dy; newX = startLX + dx; newY = startTY + dy; }
        else if (corner === 't') { newH = startH - dy; newY = startTY + dy; }
        else if (corner === 'b') { newH = startH + dy; }
        else if (corner === 'l') { newW = startW - dx; newX = startLX + dx; }
        else if (corner === 'r') { newW = startW + dx; }
        // 角手柄默认等比缩放（按住 Shift 自由拉伸）；边手柄始终自由拉伸
        const isEdge = ['t','b','l','r'].includes(corner);
        if (!isEdge && !ev.shiftKey) {
          if (Math.abs(dx) / startW > Math.abs(dy) / startH) newH = newW / ratio;
          else newW = newH * ratio;
          if (corner === 'tl') { newX = startLX + startW - newW; newY = startTY + startH - newH; }
          else if (corner === 'tr') { newY = startTY + startH - newH; }
          else if (corner === 'bl') { newX = startLX + startW - newW; }
        }
        it.x = Math.round(newX); it.y = Math.round(newY);
        it.w = Math.max(20, Math.round(newW)); it.h = Math.max(20, Math.round(newH));
        // 仅移动属性，避免每次重新渲染整树
        const child = container.querySelector(`.image-item[data-id="${it.id}"]`);
        if (child) {
          child.style.left = it.x + 'px';
          child.style.top = it.y + 'px';
          child.style.width = it.w + 'px';
          child.style.height = it.h + 'px';
        }
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        saveState();
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    };
  });
  container.appendChild(el);
}

function adjustImageZ(id, op) {
  const item = state.imageItems.find(x => x.id === id);
  if (!item) return;
  if (op === 'bottom') {
    // 置底：移到 z<0 槽（专门容器 #image-bg 渲染，层级在玩法和文字之下）
    item.z = -1;
  } else {
    // 其它操作：在 fgList（z>=0）内调整层级
    const curZ = item.z || 0;
    if (curZ < 0) {
      // 当前置底，先从 bg 槽捞出
      const maxFgZ = state.imageItems.reduce((m, x) => Math.max(m, (x.z || 0) >= 0 ? (x.z || 0) : -1), -1);
      item.z = maxFgZ + 1;
    }
    const fgList = state.imageItems.filter(x => (x.z || 0) >= 0).sort((a, b) => (a.z || 0) - (b.z || 0));
    const i = fgList.indexOf(item);
    if (i < 0) { fgList.push(item); }
    if (op === 'top') {
      fgList.splice(fgList.indexOf(item), 1);
      fgList.push(item);
    } else if (op === 'up') {
      const idx = fgList.indexOf(item);
      if (idx < fgList.length - 1) {
        fgList.splice(idx, 1);
        fgList.splice(idx + 1, 0, item);
      }
    } else if (op === 'down') {
      const idx = fgList.indexOf(item);
      if (idx > 0) {
        fgList.splice(idx, 1);
        fgList.splice(idx - 1, 0, item);
      }
    }
    fgList.forEach((x, i) => { x.z = i; });
  }
  renderImageItems();
  saveState();
}

function adjustTextZ(id, op) {
  const arr = state.textItems;
  const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return;
  const max = arr.length - 1;
  let newIdx = idx;
  if (op === 'top') newIdx = max;
  else if (op === 'bottom') newIdx = 0;
  else if (op === 'up') newIdx = Math.min(max, idx + 1);
  else if (op === 'down') newIdx = Math.max(0, idx - 1);
  if (newIdx === idx) return;
  const [it] = arr.splice(idx, 1);
  arr.splice(newIdx, 0, it);
  arr.forEach((x, i) => { x.z = i; });
  renderTextItems();
  saveState();
}

function adjustItemZ(id, op) {
  const arr = state.menu.items;
  const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return;
  const max = arr.length - 1;
  let newIdx = idx;
  if (op === 'top') newIdx = max;
  else if (op === 'bottom') newIdx = 0;
  else if (op === 'up') newIdx = Math.min(max, idx + 1);
  else if (op === 'down') newIdx = Math.max(0, idx - 1);
  if (newIdx === idx) return;
  const [it] = arr.splice(idx, 1);
  arr.splice(newIdx, 0, it);
  renderMenuItems();
  saveState();
}

function showCtxMenu(x, y, items) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  items.forEach(it => {
    if (it.sep) {
      const s = document.createElement('div');
      s.className = 'ctx-sep';
      menu.appendChild(s);
    } else {
      const d = document.createElement('div');
      d.className = 'ctx-item';
      d.textContent = it.label;
      d.onclick = (e) => { e.stopPropagation(); menu.remove(); it.act(); };
      menu.appendChild(d);
    }
  });
  document.body.appendChild(menu);
  // 边界
  const rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + 'px';
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + 'px';
}

function setupImageItemDrag() {
  const containers = [$('#image-items'), $('#image-bg')].filter(Boolean);
  if (!containers.length) return;
  let dragging = null, startPt = null, startEl = null;
  let lastLockedClickTime = 0, lastLockedClickId = null;
  const onDown = (e) => {
    if (spaceDown) return;
    // 命中"🔓 解锁"按钮：直接解锁，不依赖后续 click 事件
    if (e.target.classList.contains('lock-badge')) {
      e.preventDefault();
      e.stopPropagation();
      const lockEl = e.target.closest('.image-item');
      if (lockEl) {
        const lockItem = state.imageItems.find(t => t.id === lockEl.dataset.id);
        if (lockItem && lockItem.locked) {
          lockItem.locked = false;
          renderImageItems();
          saveState();
        }
      }
      return;
    }
    if (e.target.classList.contains('del-btn') || e.target.classList.contains('resize-handle')) return;
    const el = e.target.closest('.image-item');
    if (!el) return;
    const id = el.dataset.id;
    const item = state.imageItems.find(t => t.id === id);
    if (!item) return;
    // 锁定的图片：左键/中键事件穿透，避免大框遮住下方的文字/玩法
    // 右键不受影响，仍能弹出解锁菜单
    // 双击锁定图片 → 弹出右键菜单（图层操作），不穿透
    if (item.locked && e.button !== 2) {
      const now = Date.now();
      if (now - lastLockedClickTime < 400 && lastLockedClickId === id) {
        lastLockedClickTime = 0;
        e.preventDefault();
        e.stopPropagation();
        state.imageSelection = id;
        renderImageItems();
        el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: e.clientX, clientY: e.clientY }));
        return;
      }
      lastLockedClickTime = now;
      lastLockedClickId = id;
      const prevPE = el.style.pointerEvents;
      el.style.pointerEvents = 'none';
      const underlying = document.elementFromPoint(e.clientX, e.clientY);
      el.style.pointerEvents = prevPE;
      if (underlying && underlying !== el && !el.contains(underlying)) {
        e.preventDefault();
        e.stopPropagation();
        underlying.dispatchEvent(new MouseEvent('mousedown', {
          bubbles: true, cancelable: true, view: window,
          clientX: e.clientX, clientY: e.clientY,
          button: e.button, buttons: e.buttons,
          shiftKey: e.shiftKey, altKey: e.altKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey
        }));
      } else {
        e.preventDefault();
        e.stopPropagation();
      }
      return;
    }
    e.stopPropagation();
    e.preventDefault();
    if (item.locked) return;
    // mousedown 阶段就更新选中状态（不依赖后续 click 事件）
    state.imageSelection = id;
    document.querySelectorAll('.image-item').forEach(el2 => {
      el2.classList.toggle('selected', el2.dataset.id === id);
    });
    dragging = id;
    startPt = { x: e.clientX, y: e.clientY };
    startEl = { x: item.x, y: item.y };
  };
  containers.forEach(c => c.addEventListener('mousedown', onDown));
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const item = state.imageItems.find(t => t.id === dragging);
    if (!item) return;
    const scale = state.zoom;
    item.x = startEl.x + (e.clientX - startPt.x) / scale;
    item.y = startEl.y + (e.clientY - startPt.y) / scale;
    // 只更新被拖动图片的位置，不重建 DOM（避免每次 mousemove 全量重建导致卡死）
    const child = document.querySelector(`.image-item[data-id="${dragging}"]`);
    if (child) {
      child.style.left = Math.round(item.x) + 'px';
      child.style.top = Math.round(item.y) + 'px';
    }
  });
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = null; saveState(); }
  });
}

function renderItemsList() {
  const list = $('#items-list');
  list.innerHTML = '';
  state.menu.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="ico" title="点击换图标">${item.iconUrl ? `<img src="${item.iconUrl}" crossorigin="anonymous" referrerpolicy="no-referrer">` : ''}</div>
      <input class="nm" type="text" value="${item.name.replace(/"/g, '&quot;')}" placeholder="名称">
      <div class="ct"><input type="number" value="${item.count}" min="0"></div>
      <button class="side-toggle">${item.side === 'right' ? '右' : '左'}</button>
      <div class="acts">
        <button class="mv-up" title="上移">▲</button>
        <button class="mv-dn" title="下移">▼</button>
        <button class="del" title="删除">✕</button>
      </div>
    `;
    row.querySelector('.ico').onclick = () => openPicker(item.id);
    row.querySelector('.nm').oninput = (e) => { item.name = e.target.value; renderMenuItems(); saveState(); };
    row.querySelector('.ct input').oninput = (e) => { item.count = parseInt(e.target.value) || 0; renderMenuItems(); saveState(); };
    row.querySelector('.side-toggle').onclick = () => {
      item.side = item.side === 'right' ? 'left' : 'right';
      render();
    };
    row.querySelector('.mv-up').onclick = () => {
      const pos = getItemPos(item);
      item.x = pos.x;
      item.y = pos.y - 10;
      render();
    };
    row.querySelector('.mv-dn').onclick = () => {
      const pos = getItemPos(item);
      item.x = pos.x;
      item.y = pos.y + 10;
      render();
    };
    row.querySelector('.del').onclick = () => {
      state.menu.items = state.menu.items.filter(it => it.id !== item.id);
      state.selection = state.selection.filter(id => id !== item.id);
      render();
    };
    list.appendChild(row);
  });
}

/* ============== Selection ============== */
function updateSelectionUI() {
  const n = state.selection.length;
  if ($('#sel-style-count')) $('#sel-style-count').textContent = n;
  if ($('#sel-all')) $('#sel-all').disabled = state.menu.items.length === 0;
  if ($('#sel-clear')) $('#sel-clear').disabled = n === 0;
  const sec = $('#sel-style-section');
  if (sec) sec.style.display = n > 0 ? 'block' : 'none';
  // 单个玩法选中时显示「数量」输入框
  const countRow = $('#count-edit-row');
  if (countRow) {
    if (n === 1) {
      const item = state.menu.items.find(it => it.id === state.selection[0]);
      if (item) {
        countRow.style.display = 'flex';
        $('#item-count').value = item.count;
      } else {
        countRow.style.display = 'none';
      }
    } else {
      countRow.style.display = 'none';
    }
  }
  if (n > 0) updateSelStylePanel();
}

function updateSelStylePanel() {
  const items = state.menu.items.filter(it => state.selection.includes(it.id));
  if (items.length === 0) return;
  $('#sel-style-count').textContent = items.length;
  const first = getEffectiveStyle(items[0]);
  $('#sel-font-size').value = first.fontSize;
  $('#sel-font-weight').value = String(first.fontWeight) === '400' ? '400' : '900';
  $('#sel-stroke-color').value = first.strokeColor;
  $('#sel-stroke-width').value = first.strokeWidth;
  $('#sel-shadow-x').value = first.shadowX;
  $('#sel-shadow-y').value = first.shadowY;
  $('#sel-shadow-blur').value = first.shadowBlur;
  $('#sel-shadow-color').value = first.shadowColor;
  $('#sel-text-color').value = first.textColor;
  $('#sel-letter-spacing').value = first.letterSpacing;
  $('#sel-row-gap').value = state.style.rowGap;  // 全局 rowGap（不是 per-item）
  $('#sel-row-height').value = first.rowHeight;
  $('#sel-show-bg').checked = first.bgOn;
  $('#sel-bg-color').value = first.bgColor;
  $('#sel-bg-radius').value = first.bgRadius;
  $('#sel-bg-opacity').value = Math.round(first.bgOpacity * 100);
}

function applySelStyle(mutator) {
  state.menu.items.forEach(item => {
    if (!state.selection.includes(item.id)) return;
    if (!item.style) item.style = {};
    mutator(item.style);
  });
  render();
}

function alignSelection(direction) {
  const selected = state.menu.items.filter(it => state.selection.includes(it.id));
  if (selected.length < 2) return;
  const positions = selected.map(it => {
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    return { item: it, x: pos.x, y: pos.y, w: getItemWidth(it, st), h: st.rowHeight };
  });
  let target;
  if (direction === 'left') {
    target = Math.min(...positions.map(p => p.x));
    positions.forEach(p => { p.item.x = target; });
  } else if (direction === 'right') {
    target = Math.max(...positions.map(p => p.x + p.w));
    positions.forEach(p => { p.item.x = target - p.w; });
  } else if (direction === 'top') {
    target = Math.min(...positions.map(p => p.y));
    positions.forEach(p => { p.item.y = target; });
  } else if (direction === 'bottom') {
    target = Math.max(...positions.map(p => p.y + p.h));
    positions.forEach(p => { p.item.y = target - p.h; });
  }
  render();
  saveState();
}

/* ============== Drag / Pan / Zoom ============== */
let spaceDown = false;

function setupInteraction() {
  const viewport = $('#canvas-viewport');
  const wrap = $('#canvas-wrap');

  // 点击画布（对象/空白）时释放侧栏输入框焦点，确保之后 Backspace/Delete 能一键删除选中对象
  // 捕获阶段监听：先于各元素的 mousedown（含 stopPropagation 的文字/玩法项）执行
  document.addEventListener('mousedown', e => {
    if (e.target.closest('input,textarea,select')) return; // 点击的就是输入框，不动
    const ae = document.activeElement;
    if (ae && ae.tagName && ae.matches('input,textarea,select')) ae.blur();
  }, true);

  // Space key for pan
  window.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    if (e.code === 'Space') {
      spaceDown = true;
      document.body.classList.add('pan-ready');
      e.preventDefault();
    }
    // Backspace / Delete 删除选中的对象（玩法 / 文字 / 图片）
    if ((e.key === 'Backspace' || e.key === 'Delete') && state.imageSelection) {
      e.preventDefault();
      state.imageItems = state.imageItems.filter(it => it.id !== state.imageSelection);
      state.imageSelection = null;
      render();
    } else if ((e.key === 'Backspace' || e.key === 'Delete') && state.textSelection && state.textSelection.length) {
      e.preventDefault();
      const ids = new Set(state.textSelection);
      state.textItems = state.textItems.filter(it => !ids.has(it.id));
      state.textSelection = [];
      syncTextInputsFromSelection();
      render();
    } else if ((e.key === 'Backspace' || e.key === 'Delete') && state.selection && state.selection.length) {
      e.preventDefault();
      state.menu.items = state.menu.items.filter(it => !state.selection.includes(it.id));
      state.selection = [];
      render();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      spaceDown = false;
      document.body.classList.remove('pan-ready');
      document.body.classList.remove('panning');
    }
  });

  // Pan: space+drag or middle mouse — 用 wrap 滚动条作为平移
  let panning = false, panStart = { x: 0, y: 0, sx: 0, sy: 0 };
  viewport.addEventListener('mousedown', e => {
    if (spaceDown || e.button === 1) {
      panning = true;
      const wrap = $('#canvas-wrap');
      panStart = { x: e.clientX, y: e.clientY, sx: wrap.scrollLeft, sy: wrap.scrollTop };
      document.body.classList.add('panning');
      e.preventDefault();
      return;
    }
    if (e.target.closest('.menu-item')) return; // 点击玩法项不触发框选
    if (e.target.closest('.image-item')) return; // 点击图片不触发框选
    if (e.target.closest('.text-item')) return; // 点击文字不触发框选
    // 空白点击：清除图片选中
    if (state.imageSelection) { state.imageSelection = null; renderImageItems(); }
    startMarquee(e);
  });
  window.addEventListener('mousemove', e => {
    if (panning) {
      const wrap = $('#canvas-wrap');
      wrap.scrollLeft = panStart.sx - (e.clientX - panStart.x);
      wrap.scrollTop = panStart.sy - (e.clientY - panStart.y);
    }
  });
  window.addEventListener('mouseup', () => {
    if (panning) {
      panning = false;
      document.body.classList.remove('panning');
      saveState();
    }
  });

  // Zoom: Alt+wheel — 以鼠标位置为锚点缩放
  wrap.addEventListener('wheel', e => {
    if (document.body.classList.contains('source-mode')) return;
    if (!e.altKey && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const newZoom = Math.max(0.05, Math.min(6, state.zoom * factor));
    if (newZoom === state.zoom) return;
    // 鼠标下的内容坐标（canvas 内坐标）
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const oldZoom = state.zoom;
    const oldScrollX = wrap.scrollLeft;
    const oldScrollY = wrap.scrollTop;
    const cx = (oldScrollX + mx) / oldZoom;
    const cy = (oldScrollY + my) / oldZoom;
    state.zoom = newZoom;
    applyTransform();
    // 缩放后让 (cx, cy) 仍落在鼠标下
    requestAnimationFrame(() => {
      const maxX = wrap.scrollWidth - wrap.clientWidth;
      const maxY = wrap.scrollHeight - wrap.clientHeight;
      let newScrollX = cx * newZoom - mx;
      let newScrollY = cy * newZoom - my;
      newScrollX = Math.max(0, Math.min(maxX, newScrollX));
      newScrollY = Math.max(0, Math.min(maxY, newScrollY));
      wrap.scrollLeft = newScrollX;
      wrap.scrollTop = newScrollY;
    });
  }, { passive: false });

  // wrap 滚动同步到 state.panX/panY
  wrap.addEventListener('scroll', () => {
    if (document.body.classList.contains('source-mode')) return;
    const centerX = (wrap.scrollWidth - wrap.clientWidth) / 2;
    const centerY = (wrap.scrollHeight - wrap.clientHeight) / 2;
    state.panX = wrap.scrollLeft - centerX;
    state.panY = wrap.scrollTop - centerY;
  }, { passive: true });

  // Zoom buttons — 以画布中心为锚点
  $('#zoom-in').onclick = () => {
    const wrap = $('#canvas-wrap');
    const oldZoom = state.zoom;
    const newZoom = Math.min(6, oldZoom * 1.2);
    if (newZoom === oldZoom) return;
    const cx = (wrap.scrollLeft + wrap.clientWidth / 2) / oldZoom;
    const cy = (wrap.scrollTop + wrap.clientHeight / 2) / oldZoom;
    state.zoom = newZoom;
    applyTransform();
    requestAnimationFrame(() => {
      wrap.scrollLeft = cx * newZoom - wrap.clientWidth / 2;
      wrap.scrollTop = cy * newZoom - wrap.clientHeight / 2;
      saveState();
    });
  };
  $('#zoom-out').onclick = () => {
    const wrap = $('#canvas-wrap');
    const oldZoom = state.zoom;
    const newZoom = Math.max(0.05, oldZoom / 1.2);
    if (newZoom === oldZoom) return;
    const cx = (wrap.scrollLeft + wrap.clientWidth / 2) / oldZoom;
    const cy = (wrap.scrollTop + wrap.clientHeight / 2) / oldZoom;
    state.zoom = newZoom;
    applyTransform();
    requestAnimationFrame(() => {
      wrap.scrollLeft = cx * newZoom - wrap.clientWidth / 2;
      wrap.scrollTop = cy * newZoom - wrap.clientHeight / 2;
      saveState();
    });
  };

  $('#zoom-fit').onclick = fitToWindow;

  // Drag menu items
  setupItemDrag();
  // Marquee selection
  setupMarquee();
}

function setupItemDrag() {
  let dragging = false, dragStart = null, dragIds = [];

  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (spaceDown) return;
    const el = e.target.closest('.menu-item');
    if (!el) return;
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const id = el.dataset.id;
    let ids = state.selection.slice();
    if (e.shiftKey) {
      if (ids.includes(id)) ids = ids.filter(x => x !== id);
      else ids.push(id);
    } else if (!ids.includes(id)) {
      ids = [id];
    }
    state.selection = ids;
    dragging = true;
    const items = state.menu.items.filter(it => ids.includes(it.id));
    dragStart = {
      x: e.clientX, y: e.clientY,
      items: items.map(it => {
        const p = getItemPos(it);  // 用实际渲染位置，避免 null → 0 导致全部重叠
        return { id: it.id, x: p.x, y: p.y };
      })
    };
    dragIds = ids;
    document.body.classList.add('panning');
    // 只更新选中态，不重建 DOM（否则 dblclick 永远不触发）
    document.querySelectorAll('.menu-item').forEach(el2 => {
      el2.classList.toggle('selected', ids.includes(el2.dataset.id));
    });
    updateSelectionUI();
  }, true);  // ← capture 阶段，确保最先执行

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const scale = state.zoom;
    const dx = (e.clientX - dragStart.x) / scale;
    const dy = (e.clientY - dragStart.y) / scale;
    // 性能：直接改 DOM 位置，不重建（重建会重新加载图标 <img> 造成闪烁+卡顿）
    dragStart.items.forEach(d => {
      const item = state.menu.items.find(it => it.id === d.id);
      if (!item) return;
      item.x = d.x + dx;
      item.y = d.y + dy;
      const dom = document.querySelector('.menu-item[data-id="' + d.id + '"]');
      if (dom) {
        dom.style.left = Math.round(item.x) + 'px';
        dom.style.top = Math.round(item.y) + 'px';
      }
    });
  });

  window.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      document.body.classList.remove('panning');
      hideSnapGuides();
      renderMenuItems();
      saveState();
    }
  });
}

function applySnapGuides(dragIds) {
  const SNAP = 6; // px threshold
  const vGuide = $('#guide-v');
  const hGuide = $('#guide-h');
  vGuide.style.display = 'none';
  hGuide.style.display = 'none';

  const dragged = state.menu.items.filter(it => dragIds.includes(it.id));
  if (!dragged.length) return;

  // collect snap targets (canvas edges + other items)
  const cw = state.canvas.width;
  const ch = state.canvas.height;
  const vTargets = [0, cw / 2, cw];
  const hTargets = [0, ch / 2, ch];
  state.menu.items.forEach(it => {
    if (dragIds.includes(it.id)) return;
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    const w = getItemWidth(it, st);
    vTargets.push(pos.x, pos.x + w / 2, pos.x + w);
    hTargets.push(pos.y, pos.y + st.rowHeight / 2, pos.y + st.rowHeight);
  });

  let bestV = null, bestVDelta = SNAP + 1;
  let bestH = null, bestHDelta = SNAP + 1;

  dragged.forEach(it => {
    const pos = getItemPos(it);
    const st = getEffectiveStyle(it);
    const w = getItemWidth(it, st);
    const myV = [pos.x, pos.x + w / 2, pos.x + w];
    const myH = [pos.y, pos.y + st.rowHeight / 2, pos.y + st.rowHeight];
    myV.forEach(v => {
      vTargets.forEach(t => {
        const delta = Math.abs(v - t);
        if (delta < bestVDelta) {
          bestVDelta = delta;
          bestV = { from: v, to: t };
        }
      });
    });
    myH.forEach(h => {
      hTargets.forEach(t => {
        const delta = Math.abs(h - t);
        if (delta < bestHDelta) {
          bestHDelta = delta;
          bestH = { from: h, to: t };
        }
      });
    });
  });

  // apply snap: shift each dragged item by (to - from)
  if (bestV && bestVDelta <= SNAP) {
    const shift = bestV.to - bestV.from;
    dragged.forEach(it => { it.x += shift; });
    vGuide.style.display = 'block';
    vGuide.style.left = bestV.to + 'px';
    vGuide.style.top = '0';
    vGuide.style.height = ch + 'px';
  }
  if (bestH && bestHDelta <= SNAP) {
    const shift = bestH.to - bestH.from;
    dragged.forEach(it => { it.y += shift; });
    hGuide.style.display = 'block';
    hGuide.style.top = bestH.to + 'px';
    hGuide.style.left = '0';
    hGuide.style.width = cw + 'px';
  }
}

function hideSnapGuides() {
  $('#guide-v').style.display = 'none';
  $('#guide-h').style.display = 'none';
}

function setupMarquee() {
  const stage = $('#stage');
  const marquee = $('#marquee');
  let mousing = false, startPt = null;

  stage.addEventListener('mousedown', e => {
    if (spaceDown) return;
    if (e.target.closest('.menu-item')) return;
    if (e.target.closest('.text-item')) return;
    if (e.button !== 0) return;
    mousing = true;
    const rect = stage.getBoundingClientRect();
    startPt = {
      x: (e.clientX - rect.left) / state.zoom,
      y: (e.clientY - rect.top) / state.zoom
    };
    if (!e.shiftKey) {
      state.selection = [];
      state.textSelection = [];
    }
    marquee.style.display = 'block';
    marquee.style.left = startPt.x + 'px';
    marquee.style.top = startPt.y + 'px';
    marquee.style.width = '0px';
    marquee.style.height = '0px';
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!mousing) return;
    const rect = stage.getBoundingClientRect();
    const cur = {
      x: (e.clientX - rect.left) / state.zoom,
      y: (e.clientY - rect.top) / state.zoom
    };
    const x = Math.min(startPt.x, cur.x);
    const y = Math.min(startPt.y, cur.y);
    const w = Math.abs(cur.x - startPt.x);
    const h = Math.abs(cur.y - startPt.y);
    marquee.style.left = x + 'px';
    marquee.style.top = y + 'px';
    marquee.style.width = w + 'px';
    marquee.style.height = h + 'px';

    // hit test — 玩法项
    const sel = [];
    state.menu.items.forEach(item => {
      const ix = item.x != null ? item.x : 0;
      const iy = item.y != null ? item.y : 0;
      const st = getEffectiveStyle(item);
      const iw = getItemWidth(item, st);
      const ih = st.rowHeight;
      if (ix < x + w && ix + iw > x && iy < y + h && iy + ih > y) {
        sel.push(item.id);
      }
    });
    // hit test — 文字（用 getBoundingClientRect 反算画布坐标）
    const textSel = [];
    document.querySelectorAll('.text-item').forEach(dom => {
      const id = dom.dataset.id;
      const t = state.textItems.find(x => x.id === id);
      if (!t) return;
      const r = dom.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const ix = (r.left - stageRect.left) / state.zoom;
      const iy = (r.top - stageRect.top) / state.zoom;
      const iw = r.width / state.zoom;
      const ih = r.height / state.zoom;
      if (ix < x + w && ix + iw > x && iy < y + h && iy + ih > y) {
        textSel.push(id);
      }
    });
    // shift 累加，否则替换
    if (e.shiftKey) {
      const set = new Set(state.selection);
      sel.forEach(id => set.add(id));
      state.selection = Array.from(set);
      const tset = new Set(state.textSelection);
      textSel.forEach(id => tset.add(id));
      state.textSelection = Array.from(tset);
    } else {
      state.selection = sel;
      state.textSelection = textSel;
    }
    renderMenuItems();
    renderTextItems();
    updateSelectionUI();
    syncTextInputsFromSelection();
  });

  window.addEventListener('mouseup', () => {
    if (mousing) {
      mousing = false;
      marquee.style.display = 'none';
      saveState();
    }
  });
}

/* ============== Icon Picker ============== */
let pickerTargetId = null;

const GIFT_CACHE_KEY = 'bili-gift-cache-v1';
const SHUVI_TS_KEY = 'bili-shuvi-ts-v1';
const SHUVI_INTERVAL = 20 * 3600 * 1000; // 20 小时内不重复拉远端

async function loadGifts() {
  // 先用本地缓存的礼物库秒开（避免每次都要等 gifts.json 466KB 下载+解析）
  try {
    const cached = localStorage.getItem(GIFT_CACHE_KEY);
    if (cached) {
      const arr = JSON.parse(cached);
      if (Array.isArray(arr) && arr.length) state.gifts = arr;
    }
  } catch (e) { /* ignore */ }

  if (state.gifts.length === 0) {
    try {
      const res = await fetch('gifts.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      state.gifts = Array.isArray(data) ? data : (data.gifts || []);
      // 落缓存：下次秒开，不再等 466KB 下载
      try { localStorage.setItem(GIFT_CACHE_KEY, JSON.stringify(state.gifts)); } catch (e) {}
    } catch (e) {
      state.gifts = [];
    }
  }

  // 远端增量：不再每次打开都拉（allorigins 代理很慢，会拖慢首屏），20 小时一次
  let lastTs = 0;
  try { lastTs = parseInt(localStorage.getItem(SHUVI_TS_KEY) || '0', 10) || 0; } catch (e) {}
  if (Date.now() - lastTs > SHUVI_INTERVAL) {
    fetchShuviGifts(false).catch(() => {});
  }
}

function markShuviChecked() {
  try { localStorage.setItem(SHUVI_TS_KEY, String(Date.now())); } catch (e) {}
}

// 从 https://gift.shuvi.moe/api/gifts 拉最新礼物数据（CORS 不允许，用 allorigins 代理）
// silent=true 时不更新 UI 提示
async function fetchShuviGifts(silent) {
  const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://gift.shuvi.moe/api/gifts');
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('shuvi HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.items) || [];
  // shuvi 字段：giftId/name/price/coinType/imageBasicUrl；缺 webp/gif，前端用 imageBasicUrl 兜底
  const merged = items.map(it => ({
    giftId: it.giftId, name: it.name, price: it.price, coinType: it.coinType,
    imageBasicUrl: it.imageBasicUrl,
    webp: it.imageBasicUrl,        // 兜底：没有 webp 时用基础图
    gif: it.imageBasicUrl,
    imageDynamicUrl: it.imageBasicUrl,
    frameAnimationUrl: null
  }));
  // 按 giftId 合并到现有 state.gifts
  const existingIds = new Set(state.gifts.map(g => g.giftId));
  let added = 0;
  merged.forEach(g => { if (!existingIds.has(g.giftId)) { state.gifts.push(g); added++; } });
  markShuviChecked();
  // 索引失效重建
  buildGiftMaps(); _giftMapLen = -1; _giftUrlMap = null; _giftIdMap = null;
  try { localStorage.setItem(GIFT_CACHE_KEY, JSON.stringify(state.gifts)); } catch (e) {}
  if (!silent) {
    const st = $('#icon-update-status');
    if (st) st.textContent = `状态：远端拉到 ${added} 个新礼物，已补充到图标库`;
  }
  return added;
}

// 从 shuvi.moe 拉取新礼物图标，补充到 state.gifts 图标库（不改动菜单玩法项）
async function checkAndApplyIconUpdate() {
  const st = $('#icon-update-status');
  if (st) st.textContent = '状态：拉取中…';
  let added = 0;
  try {
    // fetchShuviGifts 内部已按 giftId 去重合并到 state.gifts
    const before = state.gifts.length;
    await fetchShuviGifts(true);
    added = state.gifts.length - before;
  } catch (e) {
    if (st) st.textContent = '状态：网络异常，请稍后再试';
    return;
  }
  // 如果图标选择弹窗当前正打开着，重新渲染让用户立刻看到新图标
  if ($('#picker-modal').classList.contains('open') && typeof renderPickerGrid === 'function') {
    const searchVal = $('#picker-search') ? $('#picker-search').value : '';
    renderPickerGrid(searchVal);
  }
  if (added > 0) {
    if (st) st.textContent = `状态：新增 ${added} 个图标到「选择礼物图标」库`;
  } else {
    if (st) st.textContent = '状态：已是最新';
  }
}

// 图标 URL 压缩：三种情况
//   1) 官方礼物 CDN URL（90+ 字符）→ 'g<giftId>'（7 字符）
//   2) base64 上传图（可能几 MB！）→ '#i<序号>' 引用 imageLibrary
//   3) 其他 URL → 原样
// 第 2 条是关键：base64 直接进 URL hash 会让 history.replaceState 处理几 MB 字符串，
// 浏览器会彻底卡死。压缩成引用后 hash 只有几十字节，图片数据留在 localStorage。
let _giftUrlMap = null;      // webp/imageBasicUrl → giftId
let _giftIdMap = null;       // giftId → webp/imageBasicUrl
let _giftMapLen = -1;
function buildGiftMaps() {
  if (_giftUrlMap && _giftMapLen === state.gifts.length) return;
  const byUrl = new Map();
  const byId = new Map();
  for (const g of state.gifts) {
    const u = g.webp || g.imageBasicUrl;
    if (u) {
      byUrl.set(u, g.giftId);
      if (g.imageBasicUrl) byUrl.set(g.imageBasicUrl, g.giftId);
    }
    if (g.giftId != null) byId.set(String(g.giftId), u || '');
  }
  _giftUrlMap = byUrl;
  _giftIdMap = byId;
  _giftMapLen = state.gifts.length;
}
function urlToToken(url) {
  if (!url) return '';
  if (url.startsWith('data:')) {
    const idx = state.imageLibrary.findIndex(e => e.url === url);
    return idx >= 0 ? '#i' + idx : '';
  }
  buildGiftMaps();
  const id = _giftUrlMap.get(url);
  return id != null ? 'g' + id : url;
}
function tokenToUrl(token) {
  if (!token) return '';
  const s = String(token);
  if (s.startsWith('#i')) {
    const idx = parseInt(s.slice(2), 10);
    const e = state.imageLibrary[idx];
    return e ? e.url : '';
  }
  if (s[0] === 'g' && s.length > 1) {
    buildGiftMaps();
    return _giftIdMap.get(s.slice(1)) || '';
  }
  return s;
}

function openPicker(itemId) {
  pickerTargetId = itemId;
  $('#picker-modal').classList.add('open');
  renderPickerGrid('');
}

// 图标库上千条，一次性建上千个 DOM + 上千个 <img> 会卡好几秒。
// 改成滚动增量渲染：先画 120 个，滚到底再续 120 个。
const PICKER_PAGE = 120;
let _pickerList = [];
let _pickerShown = 0;

function renderPickerGrid(search) {
  const grid = $('#picker-grid');
  grid.innerHTML = '';
  _pickerList = state.gifts.filter(g => !search || g.name.includes(search));
  _pickerShown = 0;
  appendPickerPage();
}

function appendPickerPage() {
  const grid = $('#picker-grid');
  if (!grid) return;
  const end = Math.min(_pickerShown + PICKER_PAGE, _pickerList.length);
  const frag = document.createDocumentFragment();
  for (let i = _pickerShown; i < end; i++) {
    const gift = _pickerList[i];
    const cell = document.createElement('div');
    cell.className = 'icon-cell';
    cell.innerHTML = `
      <div class="img-wrap"><img loading="lazy" decoding="async" src="${gift.webp || gift.url || ''}" alt="" crossorigin="anonymous" referrerpolicy="no-referrer"></div>
      <div class="nm">${gift.name}</div>
    `;
    cell.onclick = () => {
      $('#picker-modal').classList.remove('open');
      const item = state.menu.items.find(it => it.id === pickerTargetId);
      if (item) {
        item.iconUrl = gift.webp || gift.url || '';
        item.iconType = 'lib';
        render();
      }
    };
    frag.appendChild(cell);
  }
  grid.appendChild(frag);
  _pickerShown = end;
  if (_pickerShown < _pickerList.length) {
    const more = document.createElement('div');
    more.className = 'nm';
    more.style.cssText = 'grid-column:1/-1;text-align:center;padding:12px 0;opacity:.6;';
    more.textContent = `继续下滑加载更多（已显示 ${_pickerShown} / ${_pickerList.length}）`;
    grid.appendChild(more);
  }
}

/* ============== 歌单整理工具（独立画布） ============== */
// 完全独立的画布：自己的尺寸、样式、数据（localStorage 独立键），
// 与菜单画布（state）互不影响。预览和导出都用 Canvas 2D 绘制，
// 所以导出的 PNG 和预览 100% 一致，也不依赖 DOM 截图。
const PL_KEY = 'bili-playlist-v1';
const PL_VER = 2;

const PL_DEFAULT = {
  _v: PL_VER,
  text: '',
  size: '1080x1920',
  zoom: 0.35,
  previewBg: 'dark',
  fs: 28, lh: 1.6, cols: 1, fw: '900',
  color: '#ffffff', sw: 3, sc: '#000000',
  bg: '#101014', bgTrans: true,
  // 排列：order 保持顺序 / len 按字数分组 / style 按风格+字数
  arrange: 'order', stylePos: 'before',
  showGroupTitle: true, groupFs: 34, groupColor: '#00aeec',
  title: '', titleFs: 48, titleColor: '#00aeec',
  number: true, numFmt: 'dot', numStart: 1,
  padTop: 80, padX: 80, colGap: 60, autoCol: true
};
let plState = Object.assign({}, PL_DEFAULT);

function plSave() {
  plState._v = PL_VER;
  try { localStorage.setItem(PL_KEY, JSON.stringify(plState)); } catch (e) {}
}
function plLoad() {
  try {
    const raw = localStorage.getItem(PL_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return;
    plState = Object.assign({}, PL_DEFAULT, d);
    // 版本迁移：老数据升级到 v2 → 默认改透明底、默认去掉标题文字
    if (!d._v || d._v < 2) {
      plState.bgTrans = true;
      plState._v = PL_VER;
    }
  } catch (e) {}
}

// ---- 文本整理 ----
// 清掉：行首/行尾时长、行首序号（1. / 1、 / 1) / [1] / (1) / ①…）、项目符号、多余空格
// 注意顺序：先处理「时长」，再处理「序号」，否则 "03:21 稻香" 会被序号规则切成 "21 稻香"
function plCleanLine(s) {
  let t = String(s || '');
  t = t.replace(/\r/g, '');
  // 整行只有时长 → 丢掉
  if (/^\s*\d{1,2}:\d{2}(:\d{2})?\s*$/.test(t)) return '';
  // 行首时长 + 空格："03:21 稻香" / "03:21 - 稻香"
  t = t.replace(/^\s*\d{1,2}:\d{2}(:\d{2})?\s*[\-–—]?\s+/, '');
  // 项目符号
  t = t.replace(/^\s*[\-\*\u2022\u25cf\u25cb]\s*/, '');
  // 括号序号：[1] (1) 【1】
  t = t.replace(/^\s*[\[\(【]\s*\d{1,3}\s*[\]\)】]\s*[\.\)、,：\-]?\s*/, '');
  // 裸序号：1. 1、 1) 1： 1-（用负向断言避开 "3.5" 这类小数）
  t = t.replace(/^\s*\d{1,3}\s*[\.\)、,：\-]\s*(?!\d)/, '');
  // 圈号 ①-⑳
  t = t.replace(/^\s*[\u2460-\u2473\u3251-\u325F\u32B1-\u32BF]\s*/, '');
  // 行尾时长
  t = t.replace(/\s*\d{1,2}:\d{2}(:\d{2})?\s*$/, '');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}
// 中文排序：显式指定拼音 collation，避免部分环境退回码点序
let _plCollator = null;
function plCollator() {
  if (!_plCollator) {
    try { _plCollator = new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base', collation: 'pinyin' }); }
    catch (e) { _plCollator = new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' }); }
  }
  return _plCollator;
}
// 解析一行：拆出「风格」和「歌名」
//   支持 [风格]歌名 / 【风格】歌名 / （风格）歌名（自动识别，与 stylePos 无关）
//   也支持 风格|歌名 或 歌名|风格（| 或 ｜ 分隔），谁在前由 stylePos 决定
function plParseSong(line) {
  let t = plCleanLine(line);
  if (!t) return null;
  let style = '';
  const m = t.match(/^[\[【(（]\s*([^\]】)）]{1,10})\s*[\]】)）]\s*(.+)$/);
  if (m && m[2] && m[2].trim()) {
    style = m[1].trim();
    t = m[2].trim();
  } else {
    const parts = t.split(/\s*[|｜]\s*/);
    if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
      if (plState.stylePos === 'after') { t = parts[0].trim(); style = parts[1].trim(); }
      else { style = parts[0].trim(); t = parts[1].trim(); }
    }
  }
  t = t.trim();
  if (!t) return null;
  // 字数：按字符数（中文一字算一个，英文/数字按字符）
  return { name: t, style, len: Array.from(t).length };
}
function plSongsParsed() {
  return String(plState.text || '').split('\n').map(plParseSong).filter(Boolean);
}
function plSongs() {
  return plSongsParsed().map(s => s.name);
}
// 字数分组标题："一字" "二字" … 超过十字用数字
const PL_CN_NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function plLenLabel(n) {
  return (n >= 1 && n <= 10 ? PL_CN_NUM[n] : String(n)) + '字';
}

// 把歌单拍平成「绘制行」：{ type:'group'|'song', text }
// 排列方式决定分组和顺序，具体分列交给 plDraw 做
function plRows() {
  const songs = plSongsParsed();
  const mode = plState.arrange || 'order';
  const hasStyle = songs.some(s => s.style);
  const rows = [];
  let counter = Math.max(1, +plState.numStart || 1);
  const songRow = (s) => {
    rows.push({ type: 'song', text: (plState.number ? plNumLabel(counter++) + ' ' : '') + s.name });
  };
  const groupRow = (label) => {
    if (plState.showGroupTitle) rows.push({ type: 'group', text: label });
  };
  const byLen = (arr) => arr.slice().sort((a, b) => a.len - b.len);

  // 选了「按风格」但一条风格标签都没有 → 退回「按字数分组」，比原样罗列更有用
  const useLen = mode === 'len' || (mode === 'style' && !hasStyle);

  if (useLen) {
    // 一个字一组、两个字一组……按字数升序
    const lens = Array.from(new Set(songs.map(s => s.len))).sort((a, b) => a - b);
    lens.forEach(L => {
      groupRow(plLenLabel(L));
      byLen(songs.filter(s => s.len === L)).forEach(songRow);
    });
  } else if (mode === 'style' && hasStyle) {
    // 先按风格分组（风格顺序＝首次出现顺序），每个风格内再按字数升序
    const order = [];
    const map = new Map();
    songs.forEach(s => {
      const k = s.style || '其他';
      if (!map.has(k)) { map.set(k, []); order.push(k); }
      map.get(k).push(s);
    });
    order.forEach(k => {
      groupRow(k);
      byLen(map.get(k)).forEach(songRow);
    });
  } else {
    songs.forEach(songRow);
  }
  return rows;
}
function plSetText(lines) {
  plState.text = lines.join('\n');
  const ta = $('#pl-text');
  if (ta) ta.value = plState.text;
  plUpdateStat();
  plDraw();
  plSave();
}
function plUpdateStat() {
  const parsed = plSongsParsed();
  const n = parsed.length;
  const raw = String(plState.text || '').split('\n').filter(l => l.trim()).length;
  let extra = '';
  if (n) {
    const lens = Array.from(new Set(parsed.map(s => s.len))).sort((a, b) => a - b);
    const styles = Array.from(new Set(parsed.map(s => s.style).filter(Boolean)));
    if (styles.length) extra += ` · ${styles.length} 个风格`;
    extra += ` · ${lens.length} 种字数（${lens.map(l => l + '字').join('/')}）`;
  }
  const el = $('#pl-stat');
  if (el) el.textContent = `${n} 首${raw !== n ? `（原始 ${raw} 行）` : ''}${extra}`;
}

function plApplyOp(op) {
  let lines = String(plState.text || '').split('\n');
  if (op === 'trim') {
    lines = lines.filter(l => l.trim());
  } else if (op === 'dedup') {
    const seen = new Set();
    const out = [];
    lines.forEach(l => {
      const s = plParseSong(l);
      if (!s) return;
      const key = s.name.toLowerCase();   // 按歌名去重（同一首歌不同风格标签也算重复）
      if (seen.has(key)) return;
      seen.add(key);
      out.push(l);
    });
    lines = out;
  } else if (op === 'clean') {
    lines = lines.map(l => {
      const s = plParseSong(l);
      if (!s) return '';
      // 清格式时把风格写成规范化的 "风格|歌名"，避免反复解析
      return s.style ? `${s.style}|${s.name}` : s.name;
    }).filter(Boolean);
  } else if (op === 'sort') {
    // 有风格时先按风格，再按歌名（拼音）；风格统一排在前面
    lines = lines.filter(l => l.trim()).sort((a, b) => {
      const A = plParseSong(a), B = plParseSong(b);
      if (!A || !B) return 0;
      if (A.style !== B.style) {
        if (!A.style) return 1;
        if (!B.style) return -1;
        return plCollator().compare(A.style, B.style);
      }
      return plCollator().compare(A.name, B.name);
    });
  } else if (op === 'shuffle') {
    lines = lines.filter(l => l.trim());
    for (let i = lines.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lines[i], lines[j]] = [lines[j], lines[i]];
    }
  } else if (op === 'reverse') {
    lines = lines.filter(l => l.trim()).reverse();
  }
  plSetText(lines);
}

// ---- 序号格式 ----
const PL_CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function plNumLabel(n) {
  if (n >= 1 && n <= 20 && plState.numFmt === 'circle') return PL_CIRCLED[n - 1];
  if (plState.numFmt === 'paren') return `${n})`;
  if (plState.numFmt === 'bracket') return `[${n}]`;
  return `${n}.`;
}

// ---- 绘制 ----
function plFontSpec(size) {
  const fam = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
  return `${plState.fw || 900} ${size}px ${fam}`;
}
function plDrawText(ctx, text, x, y, fill, sw, sc) {
  if (sw > 0) {
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeStyle = sc;
    ctx.lineWidth = sw * 2;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}
function plTruncate(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function plDraw() {
  const cv = $('#pl-canvas');
  if (!cv) return;
  const [W, H] = String(plState.size || '1080x1920').split('x').map(Number);
  const z = parseFloat(plState.zoom) || 0.35;
  cv.width = W; cv.height = H;
  cv.style.width = Math.round(W * z) + 'px';
  cv.style.height = Math.round(H * z) + 'px';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  // 透明底：默认不画背景（clearRect 后就是全透明），可直接叠在直播画面上
  if (!plState.bgTrans) {
    ctx.fillStyle = plState.bg || '#101014';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.textBaseline = 'alphabetic';

  // 预览底色（只影响编辑预览的容器背景，不写进 canvas）
  const wrap = document.querySelector('.pl-canvas-wrap');
  if (wrap) {
    const pv = plState.previewBg || 'dark';
    wrap.classList.toggle('pv-dark', pv === 'dark');
    wrap.classList.toggle('pv-light', pv === 'light');
    wrap.classList.toggle('pv-checker', pv === 'checker');
  }

  const rows = plRows();
  const fs = Math.max(8, +plState.fs || 28);
  const lhMult = Math.max(1, +plState.lh || 1.6);
  const lh = fs * lhMult;
  if (fs < 9) { plUpdateStat(); return; }

  const padX = Math.max(0, +plState.padX || 0);
  const padTop = Math.max(0, +plState.padTop || 0);
  const colGap = Math.max(0, +plState.colGap || 0);
  const swVal = Math.max(0, +plState.sw || 0);
  const scVal = plState.sc || '#000000';

  // 分组标题样式
  const gfs = Math.max(8, +plState.groupFs || Math.round(fs * 1.2));
  const gPadTop = Math.round(fs * 0.55);            // 组标题上方留白
  const gRowH = gfs * lhMult + gPadTop;

  // 每行高度：组标题比歌曲行高（含上方留白）
  const rowH = rows.map(r => r.type === 'group' ? gRowH : lh);
  const totalH = rowH.reduce((a, b) => a + b, 0);

  // 标题
  let y0 = padTop;
  if (plState.title) {
    const tfs = Math.max(8, +plState.titleFs || 48);
    ctx.font = plFontSpec(tfs);
    ctx.textAlign = 'center';
    const ty = y0 + tfs * 0.9;
    plDrawText(ctx, plState.title, W / 2, ty, plState.titleColor || '#00aeec', swVal * 0.5, scVal);
    ctx.textAlign = 'left';
    y0 = ty + tfs * 0.7;
  }

  const availH = Math.max(lh, H - y0 - padX);

  // ---- 分列：按「高度」贪心切列，而不是按行数 ----
  // targetH 是每列的高度上限；自动分列＝画布可用高度，手动列数＝总高/列数
  let targetH;
  if (plState.autoCol) {
    targetH = availH;
  } else {
    const wantCols = Math.max(1, Math.min(6, +plState.cols || 1));
    targetH = Math.max(lh, totalH / wantCols);
  }

  const columns = [];
  let cur = [], curH = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], h = rowH[i];
    // 本列放不下这一行 → 换列
    if (cur.length && curH + h > targetH + 0.5) {
      columns.push({ rows: cur, h: curH });
      cur = []; curH = 0;
    }
    // 组标题的「孤儿」保护：标题后面连第一首歌都放不下，就把标题推到下一列
    if (r.type === 'group' && cur.length && curH + h + lh > targetH + 0.5) {
      columns.push({ rows: cur, h: curH });
      cur = []; curH = 0;
    }
    cur.push(i); curH += h;
  }
  if (cur.length) columns.push({ rows: cur, h: curH });

  // 空歌单：标题已经画完了，直接收工（否则下面 columns[0] 越界）
  if (columns.length === 0) { plUpdateStat(); return; }

  const MAX_COLS = 6;
  const cols = Math.max(1, Math.min(MAX_COLS, columns.length));
  const colW = (W - padX * 2 - colGap * (cols - 1)) / cols;
  if (colW <= 8) { plUpdateStat(); return; }

  // ---- 绘制 ----
  let drawn = 0;
  for (let ci = 0; ci < cols; ci++) {
    const x = padX + ci * (colW + colGap);
    let y = y0;
    for (const i of columns[ci].rows) {
      const r = rows[i];
      if (r.type === 'group') {
        ctx.font = plFontSpec(gfs);
        ctx.textAlign = 'left';
        plDrawText(ctx, plTruncate(ctx, r.text, colW), x, y + gPadTop + gfs * 0.85, plState.groupColor || '#00aeec', swVal * 0.6, scVal);
      } else {
        ctx.font = plFontSpec(fs);
        ctx.textAlign = 'left';
        plDrawText(ctx, plTruncate(ctx, r.text, colW), x, y + fs * 0.85, plState.color || '#ffffff', swVal, scVal);
      }
      y += rowH[i];
      drawn++;
    }
  }

  // 溢出提示（列数已封顶但内容没画完）
  const hidden = rows.length - drawn;
  if (hidden > 0) {
    ctx.font = plFontSpec(Math.max(10, fs * 0.7));
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,80,80,0.95)';
    ctx.fillText(`⚠ 内容超出画布，还有 ${hidden} 行未显示（可缩小字号或增加列数）`, padX, H - 8);
  }
  plUpdateStat();
}

// ---- UI 双向同步 ----
const PL_INPUTS = [
  // 排列
  ['pl-arrange', 'arrange', 'str'], ['pl-style-pos', 'stylePos', 'str'],
  ['pl-show-group', 'showGroupTitle', 'bool'], ['pl-group-fs', 'groupFs', 'num'],
  ['pl-group-color', 'groupColor', 'str'],
  // 字号 / 行
  ['pl-fs', 'fs', 'num'], ['pl-lh', 'lh', 'num'], ['pl-cols', 'cols', 'num'],
  ['pl-fw', 'fw', 'str'], ['pl-color', 'color', 'str'], ['pl-sw', 'sw', 'num'],
  ['pl-sc', 'sc', 'str'], ['pl-bg', 'bg', 'str'], ['pl-bg-trans', 'bgTrans', 'bool'],
  ['pl-title', 'title', 'str'], ['pl-title-fs', 'titleFs', 'num'], ['pl-title-color', 'titleColor', 'str'],
  ['pl-number', 'number', 'bool'], ['pl-number-fmt', 'numFmt', 'str'], ['pl-number-start', 'numStart', 'num'],
  ['pl-pad-top', 'padTop', 'num'], ['pl-pad-x', 'padX', 'num'], ['pl-col-gap', 'colGap', 'num'],
  ['pl-auto-col', 'autoCol', 'bool'], ['pl-size', 'size', 'str'], ['pl-zoom', 'zoom', 'num'],
  ['pl-preview-bg', 'previewBg', 'str']
];
function plSyncToUI() {
  PL_INPUTS.forEach(([id, key, typ]) => {
    const el = $('#' + id);
    if (!el) return;
    const v = plState[key];
    if (typ === 'bool') el.checked = !!v;
    else el.value = v;
  });
  const ta = $('#pl-text');
  if (ta) ta.value = plState.text || '';
}
function plBindUI() {
  PL_INPUTS.forEach(([id, key, typ]) => {
    const el = $('#' + id);
    if (!el) return;
    el.oninput = () => {
      if (typ === 'bool') plState[key] = el.checked;
      else if (typ === 'num') plState[key] = parseFloat(el.value) || 0;
      else plState[key] = el.value;
      plDraw();
      plSave();
    };
  });
  const ta = $('#pl-text');
  if (ta) ta.oninput = () => { plState.text = ta.value; plDraw(); plUpdateStat(); plSave(); };

  document.querySelectorAll('.pl-tools button').forEach(btn => {
    btn.onclick = () => plApplyOp(btn.dataset.op);
  });

  $('#pl-open-btn').onclick = () => {
    plLoad(); plSyncToUI(); plDraw();
    $('#pl-modal').classList.add('open');
  };
  $('#pl-close').onclick = () => { plSave(); $('#pl-modal').classList.remove('open'); };
  $('#pl-save').onclick = () => {
    plSave();
    const b = $('#pl-save');
    const old = b.textContent;
    b.textContent = '已保存 ✓';
    setTimeout(() => { b.textContent = old; }, 1200);
  };

  // 导出 PNG
  $('#pl-export').onclick = () => {
    const cv = $('#pl-canvas');
    if (!cv) return;
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    a.download = `歌单_${stamp}.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  // 导出 TXT（与画布看到的排版一致，含分组标题）
  $('#pl-download-txt').onclick = () => {
    const lines = plRows().map(r => r.type === 'group' ? `【${r.text}】` : r.text);
    // 风格也一并写出来，方便再导入（风格|歌名）
    const startN = Math.max(1, +plState.numStart || 1);
    const withStyle = plSongsParsed().map((s, i) => {
      const label = plState.number ? plNumLabel(i + startN) + ' ' : '';
      return label + (s.style ? `${s.style}|${s.name}` : s.name);
    });
    const out = plState.arrange === 'order' ? withStyle : lines;
    const blob = new Blob([out.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.download = '歌单.txt';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };

  // ESC 关闭
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#pl-modal').classList.contains('open')) {
      plSave();
      $('#pl-modal').classList.remove('open');
    }
  });
}

// 每天 12:00 自动执行 checkAndApplyIconUpdate（仅编辑器模式）
function scheduleDailyIconCheck() {
  if (document.body.classList.contains('source-mode') || document.body.classList.contains('phone-mode')) return;
  const computeDelay = () => {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    if (next.getTime() <= now.getTime()) next.setDate(next.getDate() + 1);
    return next.getTime() - now.getTime();
  };
  const tick = () => {
    checkAndApplyIconUpdate().catch(() => {});
    setTimeout(tick, 24 * 3600 * 1000);
  };
  setTimeout(tick, computeDelay());
}

    // 格式：?s&d=<data>（s=source 标记，d=数据）。URL 总长 ~200 字符。
    const url = location.origin + location.pathname + '?s&d=' + dataHash;

    if (navigator.clipboard && navigator.clipboard.writeText) {

  window.addEventListener('resize', debounce(() => {

/* ============== Export PNG ============== */
async function exportPNG() {
  const btn = $('#export-png');
  const orig = btn.textContent;
  btn.textContent = '导出中...';
  btn.disabled = true;
  try {
    const stage = $('#stage');
    const stageFrame = $('#stage-frame');
    const coverMask = $('#cover-mask');
    const oldTransform = $('#stage-scaler').style.transform;
    const oldStageBg = stage.style.background;
    const oldStageBgImg = stage.style.backgroundImage;
    const oldStageBorder = stage.style.border;
    const oldStageShadow = stage.style.boxShadow;
    const oldFrameDisplay = stageFrame.style.display;
    const oldCoverMaskDisplay = coverMask ? coverMask.style.display : '';
    const oldSafeAreaDisplay = $('#safe-area').style.display;
    $('#stage-scaler').style.transform = 'none';
    stage.style.background = 'transparent';
    stage.style.backgroundImage = 'none';
    stage.style.border = 'none';
    stage.style.boxShadow = 'none';
    stageFrame.style.display = 'none';
    // 横板安全线占位块（编辑器视觉提示）一并隐藏，导出图不留黑块
    if (coverMask) coverMask.style.display = 'none';
    // 竖板安全线矩形也隐藏
    $('#safe-area').style.display = 'none';
    await new Promise(r => setTimeout(r, 100));

    // 等所有图标加载完（跨域 webp 需要时间），最多等 3 秒
    const imgs = Array.from(stage.querySelectorAll('img'));
    await Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', finish, { once: true });
        setTimeout(finish, 3000); // 超时兜底
      });
    }));

    const canvas = await html2canvas(stage, {
      backgroundColor: null,
      scale: 1,
      useCORS: true,
      allowTaint: false,
      logging: false
    });
    $('#stage-scaler').style.transform = oldTransform;
    stage.style.background = oldStageBg;
    stage.style.backgroundImage = oldStageBgImg;
    stage.style.border = oldStageBorder;
    stage.style.boxShadow = oldStageShadow;
    stageFrame.style.display = oldFrameDisplay;
    if (coverMask) coverMask.style.display = oldCoverMaskDisplay;
    $('#safe-area').style.display = oldSafeAreaDisplay;
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bilibili-menu-${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch (e) {
    alert('导出失败: ' + e.message);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

/* ============== iPhone overlay clock ============== */
function updateOverlayClock() {
  const el = $('#ovl-time');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

/* ============== Init ============== */
async function init() {
  const params = new URLSearchParams(location.search);
  const isSource = params.has('s') || params.get('source') === '1';

  // 关键：先加载礼物库再 applyLoadedData。
  // URL 里图标是 g<giftId> 压缩形式，applyLoadedData 需要 state.gifts 才能还原为 webp URL。
  // 否则 source mode 下图标会全部丢失。
  await loadGifts();

  // 上传图片库必须先加载：hash / ?d= 里的图片是 '#i<序号>' 引用，还原时需要 state.imageLibrary
  loadImageLibraryFromStorage();

  // ?reset=1：彻底重置。数据有三份拷贝（localStorage / URL hash / ?d= 参数），
  // 手动删 localStorage 没用——hash 优先级更高会把旧数据灌回来。
  // 这里清 localStorage + 洗掉 URL 上的 query 和 hash，让后面加载链自然落到默认值。
  if (params.has('reset')) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    history.replaceState(null, '', location.pathname);
    state.lastCopiedHash = '';
  }

  // 数据加载优先级：?d=（query 参数，CEF 友好）> hash > localStorage
  let loaded = false;
  const fromQuery = params.get('d');
  if (fromQuery) {
    try { applyLoadedData(decodeState(fromQuery)); loaded = true; } catch (e) {}
  }
  if (!loaded) {
    const fromHash = loadFromHash();
    if (fromHash) loaded = true;
  }
  if (!loaded) loadState();

  // Source mode：兼容 ?s（新）和 ?source=1（旧）
  if (isSource) {
    document.body.classList.add('source-mode');
    $('#status-mode').textContent = '浏览器源';
  }

  setupControls();
  setupInteraction();
  setupTextItemDrag();
  setupImageItemDrag();
  // 歌单整理工具（独立画布）
  plLoad();
  plBindUI();
  plSyncToUI();
  plDraw();
  applyMode();
  render();

  // 每天 12:00 自动检查图标更新（仅编辑器模式）
  scheduleDailyIconCheck();

  // Source mode 兜底：用 setProperty + !important 把所有可能的容器强制透明。
  // 直播姬 CEF 对 CSS 选择器经常失效，必须内联样式强写并多帧兜底。
  if (isSource) {
    const html = document.documentElement;
    html.classList.add('is-source');
    const forceTransparent = () => {
      // 包含 <html> 元素 - CSS 选择器无法从 body 反向选 html，这是关键
      const sels = ['html', 'body', '#app', '#main', '#canvas-wrap', '#canvas-scroll-inner', '#canvas-viewport', '#stage-scaler', '#stage', '#cover-mask'];
      sels.forEach(sel => {
        const el = sel === 'html' ? document.documentElement : $(sel);
        if (!el) return;
        el.style.setProperty('background', 'transparent', 'important');
        el.style.setProperty('background-color', 'transparent', 'important');
        el.style.setProperty('background-image', 'none', 'important');
      });
      const stage = $('#stage');
      if (stage) {
        stage.style.setProperty('border', 'none', 'important');
        stage.style.setProperty('box-shadow', 'none', 'important');
      }
      const frame = $('#stage-frame');
      if (frame) frame.style.setProperty('display', 'none', 'important');
    };
    forceTransparent();
    // 多帧后再次执行，避免被异步 CSS / 重排重置
    [50, 200, 500, 1500].forEach(ms => setTimeout(forceTransparent, ms));

    // MutationObserver 兜底：watch stage 的 style/class 变化，发现背景被重置就立刻清掉
    const stageEl = $('#stage');
    if (stageEl && window.MutationObserver) {
      const mo = new MutationObserver(() => {
        const bg = stageEl.style.background || stageEl.style.backgroundColor;
        if (bg && bg !== 'transparent' && !bg.includes('transparent')) {
          forceTransparent();
        }
      });
      mo.observe(stageEl, { attributes: true, attributeFilter: ['style', 'class'] });
    }
  }

  // Auto-fill default gifts only when the menu is completely empty AND
  // the user has not added any preset items that they want to keep.
  const isUntouchedDefault = state.menu.items.length === 0;
  if (isUntouchedDefault && state.gifts.length > 0) {
    for (let i = 0; i < Math.min(6, state.gifts.length); i++) {
      const g = state.gifts[i];
      state.menu.items.push({
        id: uid(), name: g.name || '礼物', count: 1,
        iconUrl: g.webp || g.url || '', iconType: 'lib',
        side: i < 3 ? 'left' : 'right', x: null, y: null, style: null
      });
    }
    render();
  }

  // Overlay clock
  updateOverlayClock();
  setInterval(updateOverlayClock, 30000);

  // Phone overlay
  if (state.phoneOverlay && state.phoneOverlay !== 'off') {
    $('#open-overlay').value = state.phoneOverlay;
    document.body.classList.add('phone-overlay-on');
    $('#safe-rect-' + state.phoneOverlay).style.display = 'block';
  }

  // Fit on first load
  if (!document.body.classList.contains('source-mode')) {
    setTimeout(fitToWindow, 100);
  } else {
    // source mode: 重新 applyTransform 确保 wrap 尺寸已就绪
    setTimeout(applyTransform, 50);
    setTimeout(applyTransform, 300);
  }
}

init();
</script>
</body>
